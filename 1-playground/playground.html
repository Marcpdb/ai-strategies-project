<meta charset="utf-8">
<title>AI Strategy Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a toggle between Playground (seven strategies on one workflow: what do we cook tonight? Dishes, Guests, Budget & time, Choose) and Sandbox (load, change, run, export). One diagram, one side panel for the clicked box, one bar with the runs. */
:root{
  --page:#f0eee6; --card:#ffffff; --ink:#1f1e1b; --muted:#6f6c64; --line:#e3e0d6;
  --green-fill:#eef4e7; --green-line:#b7d29c; --green-ink:#5b8a30;
  --io-fill:#f8e8e1; --io-line:#e8b7a4; --io-ink:#c2572f;
  --code-fill:#eceaf6; --code-line:#b9b3dc; --code-ink:#5a4fa3;
  --arrow:#a7a49c; --live:#d38a22; --live-fill:#fbefd9; --bad:#b9412f; --accent:#c2572f;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1b1a17; --card:#24231f; --ink:#ecebe6; --muted:#a9a59b; --line:#3a3832; --green-fill:#25301c; --green-line:#5d7c3e; --green-ink:#a9d27b;
  --io-fill:#3a2620; --io-line:#8a4e39; --io-ink:#f0a184; --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0;
  --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1b1a17; --card:#24231f; --ink:#ecebe6; --muted:#a9a59b; --line:#3a3832; --green-fill:#25301c; --green-line:#5d7c3e; --green-ink:#a9d27b;
  --io-fill:#3a2620; --io-line:#8a4e39; --io-ink:#f0a184; --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0;
  --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;font-weight:600;margin:0}
button,select,input,textarea{font:inherit;color:inherit} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.modes button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.wf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wf b{color:var(--ink);font-weight:600;margin-right:4px}
.wf .st{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 10px;color:var(--muted)}
.wf .st.on{border-color:var(--green-line);background:var(--green-fill);color:var(--green-ink);font-weight:600}
.wf .ar{color:var(--arrow)}
.palette{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.palette span{font-size:12px;color:var(--muted)}
.palette select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.diagram{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.svgbox{overflow-x:auto} svg.d{display:block;width:100%;min-width:620px;height:auto;user-select:none;touch-action:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 4px}
.bar .grow{flex:1 1 200px;color:var(--muted);margin:0;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)} .btn.run{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default} .btn.sm{padding:4px 10px;font-size:13px}
.runs{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:260px}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 4px;min-height:18px}
.msg{font-size:13px;color:var(--green-ink)} .msg.err{color:var(--bad)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--live-fill);border-radius:8px;padding:4px 8px}
/* svg */
.n rect{stroke-width:1.2}
.n.llm rect{fill:var(--green-fill);stroke:var(--green-line)} .n.llm text{fill:var(--green-ink)}
.n.io rect{fill:var(--io-fill);stroke:var(--io-line)} .n.io text{fill:var(--io-ink)}
.n.code rect{fill:var(--code-fill);stroke:var(--code-line)} .n.code text{fill:var(--code-ink)}
.n text{font-family:var(--f-ui);font-weight:600;font-size:17px;dominant-baseline:central;text-anchor:middle;pointer-events:none}
.n text.sub{font-size:11px;font-weight:500;fill:var(--muted)}
.n{cursor:pointer} .n.sel rect{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.n.running rect{stroke:var(--live);stroke-width:2.5;fill:var(--live-fill)} .n.done rect{stroke-width:2} .n.error rect{stroke:var(--bad);stroke-width:2.5} .n.skipped{opacity:.3}
@media (prefers-reduced-motion:no-preference){.n.running rect{animation:pulse 1.2s ease-in-out infinite}} @keyframes pulse{50%{stroke-width:4}}
.e path{fill:none;stroke:var(--arrow);stroke-width:1.6} .e.dash path{stroke-dasharray:4 5} .e.hot path{stroke:var(--live);stroke-width:2.2}
.e text,.ring text{font-family:var(--f-ui);font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.e.click{cursor:pointer} .e.click .hit{stroke:transparent;stroke-width:14;fill:none} .e.sel path{stroke:var(--ink)}
.ring circle{fill:none;stroke:var(--arrow);stroke-width:1.6;stroke-dasharray:4 5} .ring.hot circle{stroke:var(--live);stroke-width:2.2}
.bub rect,.bub path{fill:var(--card);stroke:var(--arrow);stroke-width:1.2}
.bub text{font-family:var(--f-ui);font-size:12.5px;fill:var(--ink);dominant-baseline:hanging} .bub .dot{fill:var(--live)}
@media (prefers-reduced-motion:no-preference){.bub .dot{animation:blink 1.1s infinite}.bub .dot:nth-child(2){animation-delay:.18s}.bub .dot:nth-child(3){animation-delay:.36s}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.handle{fill:var(--card);stroke:var(--arrow);stroke-width:1.5;cursor:crosshair} .handle:hover{stroke:var(--ink)}
.tmp{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
/* panel */
.panel{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-size:16px;margin:0} .panel .kind{font-size:12px;color:var(--muted);margin-top:2px}
.f{display:flex;flex-direction:column;gap:4px} .f > span{font-size:12px;font-weight:600;color:var(--muted)}
.f select,.f input,.f textarea{width:100%;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.f textarea{resize:vertical;font-family:var(--f-mono);font-size:12px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 110px;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px} .checks label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:0}
.out{background:var(--page);border-radius:6px;padding:9px;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto;margin:0}
.sep{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
</style>

<div class="wrap">
  <div class="head">
    <h1>AI Strategy Playground</h1>
    <div class="modes" role="group" aria-label="Mode"><button type="button" data-mode="play">Playground</button><button type="button" data-mode="sand">Sandbox</button></div>
  </div>
  <div class="wf" id="wf" aria-label="The workflow"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Strategies"></nav>
  <div class="palette" id="palette" hidden>
    <span>Start from</span><select id="startFrom"></select><button class="btn sm" type="button" id="loadBtn">Load</button>
    <span id="loadConfirm" class="confirm" hidden>Replace your sandbox? <button class="btn sm" type="button" id="loadYes">Replace</button><button class="btn sm" type="button" id="loadNo">Cancel</button></span>
    <span style="margin-left:10px">Add</span>
    <button class="btn sm" type="button" data-add="in">In</button><button class="btn sm" type="button" data-add="llm">LLM call</button>
    <button class="btn sm" type="button" data-add="router">Router</button><button class="btn sm" type="button" data-add="gate">Gate</button><button class="btn sm" type="button" data-add="out">Out</button>
  </div>
  <div class="stage">
    <section class="card diagram">
      <div class="svgbox"><svg class="d" id="svg" viewBox="0 0 1000 360" role="img" aria-label="Strategy diagram"></svg></div>
      <div class="bar">
        <p class="grow" id="desc"></p>
        <select class="runs" id="runs" aria-label="Last runs"></select>
        <button class="btn" type="button" id="resetBtn">Reset</button>
        <button class="btn" type="button" id="dlRuns" hidden>Download runs</button>
        <button class="btn" type="button" id="exportBtn" hidden>Export strategy</button>
        <button class="btn run" type="button" id="runBtn">Run</button>
        <button class="btn" type="button" id="stopBtn" hidden>Stop</button>
      </div>
      <div class="bar"><span class="stats" id="stats"></span><span class="msg" id="msg" aria-live="polite"></span></div>
    </section>
    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
/* =====================================================================
   ENGINE START: runs a strategy graph. The same code runs in the
   playground, the sandbox and the students' dashboards.
   Node types: in, out, llm, worker, router, gate, orchestrator,
   evaluator, debater, aux (retrieval | tools | memory, drawing only).
   Placeholders in prompts:
     {{input}}    everything that flows into the box
     {{question}} the text of the In box (the case)
     {{subtask}}  a worker's sub-task (from the orchestrator)
     {{feedback}} the evaluator's feedback (for the box it sends back to)
     {{debate}}   everything the debaters said so far
   ===================================================================== */
const ENGINE = (() => {
  const fill = (t,v) => String(t||"").replace(/\{\{(\w+)\}\}/g,(m,k)=>k in v?String(v[k]):m);
  const toks = s => Math.ceil(String(s||"").length/4);
  const words = s => (String(s).trim().match(/\S+/g)||[]).length;
  const MODELS = {"claude-haiku-5-5":{name:"Haiku 5.5",tier:"quick"},"claude-sonnet-5-5":{name:"Sonnet 5.5",tier:"default"},"claude-opus-5-5":{name:"Opus 5.5",tier:"complex"}};
  const modelOf = c => c.model==="custom" ? String(c.customId||"").trim() : c.model;
  const tierOf = c => (MODELS[c.model]||{tier:"quick"}).tier;
  const PH = /\{\{(input|question|subtask|feedback|debate)\}\}/;
  function flowEdges(g){
    const by=Object.fromEntries(g.nodes.map(n=>[n.id,n]));
    return g.edges.filter(e=>by[e.from]&&by[e.to]&&by[e.from].type!=="aux"&&by[e.to].type!=="aux"&&!e.loop&&!(by[e.from].type==="debater"&&by[e.to].type==="debater"));
  }
  function parseJSON(t){ const m=String(t).match(/\{[\s\S]*\}/); try{ return JSON.parse(m?m[0]:t); }catch(e){ return null; } }
  function retrieval(knowledge,q){
    const ws=String(q||"").toLowerCase().match(/[a-zà-ÿ0-9²]{3,}/g)||[];
    return String(knowledge||"").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean)
      .map(p=>({p,s:ws.reduce((n,w)=>n+(p.toLowerCase().includes(w)?1:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p);
  }
  function calc(expr){ const s=String(expr||""); if(!/^[0-9+\-*/().,%\s]+$/.test(s)) throw new Error("Only numbers and + - * / ( ) are allowed"); const v=Function('"use strict";return ('+s.replace(/,/g,".")+")")(); if(!Number.isFinite(v)) throw new Error("Not a finite number"); return Math.round(v*10000)/10000; }

  /* ctx: {sample, toolsOK, input (optional: replaces the In text), knowledge, memory (array), onMemory(),
           signal, hooks:{status(id,st), hot(from,to), bubble(id,b|null), label(id,text), step(stepObject)}} */
  async function run(g, ctx){
    const H=Object.assign({status(){},hot(){},bubble(){},label(){},step(){}}, ctx.hooks||{});
    const by=Object.fromEntries(g.nodes.map(n=>[n.id,n]));
    const D=flowEdges(g);
    const ins=g.nodes.filter(n=>n.type==="in"), outsN=g.nodes.filter(n=>n.type==="out");
    if(!ins.length||!outsN.length) throw {msg:"Add at least one In and one Out box, and connect them."};
    const indeg={}, adj={}; g.nodes.forEach(n=>{indeg[n.id]=0; adj[n.id]=[];});
    D.forEach(e=>{ indeg[e.to]++; adj[e.from].push(e.to); });
    const depth={}, q=g.nodes.filter(n=>indeg[n.id]===0).map(n=>n.id), order=[], d2={...indeg};
    q.forEach(id=>depth[id]=0);
    while(q.length){ const id=q.shift(); order.push(id); adj[id].forEach(t=>{ depth[t]=Math.max(depth[t]||0,depth[id]+1); if(--d2[t]===0) q.push(t); }); }
    if(order.length!==g.nodes.length) throw {msg:"The flow has a loop. Only the evaluator may send work back (its Rejected line)."};
    const levels=[]; order.forEach(id=>{ if(by[id].type!=="aux") (levels[depth[id]] ||= []).push(id); });
    const question = ctx.input!=null ? ctx.input : (ins[0].cfg.input||"");
    const val={}, dead=new Set(), skip=new Set(), inputOf={}, subtaskFor={};
    const steps=[], stats={calls:0,tin:0,tout:0,models:new Set(),answered:new Set()}, t0=performance.now();
    let transcript="";
    const now=()=>Math.round(performance.now()-t0);
    const addStep=s=>{ s.n=steps.length+1; steps.push(s); H.step(s); return s; };
    const auxFor=(id,kind)=>{ const e=g.edges.find(e=>(e.from===id&&by[e.to]&&by[e.to].type==="aux"&&by[e.to].aux===kind)||(e.to===id&&by[e.from]&&by[e.from].type==="aux"&&by[e.from].aux===kind)); return e?(e.from===id?e.to:e.from):null; };

    function tools(nd){
      const list=nd.cfg.tools||[], t=[];
      const use=async(kind,label,inp,fn)=>{ const ax=auxFor(nd.id,kind); if(ax){ H.hot(nd.id,ax); H.status(ax,"running"); H.bubble(ax,{thinking:true}); }
        const s=addStep({id:ax||nd.id,label:(ax?by[ax].label:label)+" (tool of "+nd.label+")",type:"tool",input:inp,output:"",t_start:now(),t_end:null});
        let out; try{ out=await fn(); }catch(e){ out="Error: "+(e.message||e); }
        s.output=typeof out==="string"?out:JSON.stringify(out); s.t_end=now(); H.step(s);
        if(ax){ H.bubble(ax,{text:s.output.split("\n")[0]}); H.status(ax,"done"); H.hot(ax,nd.id); }
        return out; };
      if(list.includes("retrieval")) t.push({name:"search_notes",description:"Search the project notes. Returns up to 3 relevant passages.",inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},
        execute:async i=>use("retrieval","Retrieval","search: "+i.query,()=>{ const r=retrieval(ctx.knowledge,i.query); return r.length?r.join("\n\n"):"No matching notes."; })});
      if(list.includes("calculator")) t.push({name:"calculate",description:"Calculate an arithmetic expression exactly, for example 220*165. Returns a number.",inputSchema:{type:"object",properties:{expression:{type:"string"}},required:["expression"]},
        execute:async i=>use("tools","Calculator","calculate("+i.expression+")",()=>String(calc(i.expression)))});
      if(list.includes("memory")){
        t.push({name:"read_memory",description:"Read the notes saved in earlier runs.",inputSchema:{type:"object",properties:{}},execute:async()=>use("memory","Memory","read",()=>ctx.memory&&ctx.memory.length?ctx.memory.join("\n"):"Memory is empty.")});
        t.push({name:"write_memory",description:"Save a short note for later runs.",inputSchema:{type:"object",properties:{note:{type:"string"}},required:["note"]},execute:async i=>use("memory","Memory","write: "+i.note,()=>{ (ctx.memory||[]).push(String(i.note||"").slice(0,300)); if(ctx.onMemory) ctx.onMemory(); return "Saved."; })});
      }
      return t;
    }

    async function call(nd, prompt, {json=false, shownInput="", round=null}={}){
      if(!ctx.sample) throw {code:"not_granted"};
      const c=nd.cfg, mid=modelOf(c);
      H.status(nd.id,"running"); H.bubble(nd.id,{thinking:true});
      const T=tools(nd); let usePrompt=prompt;
      const opts={signal:ctx.signal, modelTier:tierOf(c), cache:false, onText:({text})=>{ if(!json) H.bubble(nd.id,{text}); }};
      if(mid) opts.model=mid; if(c.effort) opts.effort=c.effort;
      if(T.length){ if(ctx.toolsOK) opts.tools=T; else usePrompt+=(c.tools.includes("retrieval")?"\n\nNotes:\n"+ctx.knowledge:"")+(c.tools.includes("memory")?"\n\nMemory:\n"+((ctx.memory||[]).join("\n")||"(empty)"):""); }
      const s=addStep({id:nd.id,label:nd.label,type:nd.type,round,model_asked:mid||"(tier "+tierOf(c)+")",model_answered:"",effort:c.effort||"default",tools:(c.tools||[]).join(", "),input:shownInput,prompt:usePrompt,output:"",t_start:now(),t_end:null,tokens_in:toks(usePrompt),tokens_out:0});
      let r;
      try{ r=await ctx.sample(usePrompt,opts); }
      catch(e){ H.status(nd.id,e&&e.code==="cancelled"?"":"error"); H.bubble(nd.id,null); s.output="Error: "+((e&&e.code)||"failed"); s.t_end=now(); H.step(s); throw e; }
      s.output=r.text; s.t_end=now(); s.tokens_out=toks(r.text);
      s.model_answered = r.modelApplied ? r.modelApplied : ("not "+(mid||"named")+": a "+r.modelTierApplied+"-tier model");
      stats.calls++; stats.tin+=s.tokens_in; stats.tout+=s.tokens_out; stats.models.add(mid||tierOf(c)); stats.answered.add(s.model_answered);
      H.step(s);
      let res=r.text;
      if(json){ res=parseJSON(r.text)||{}; }
      H.bubble(nd.id,{text: json ? (res.route||res.verdict||(Array.isArray(res.subtasks)?res.subtasks.length+" sub-tasks":r.text.slice(0,80))) : r.text, end:true});
      H.status(nd.id,"done");
      return res;
    }
    const combine = live => live.length>1 ? live.map(e=>"## From "+by[e.from].label+"\n"+val[e.from]).join("\n\n") : (live[0]?String(val[live[0].from]):"");
    const liveIn = id => D.filter(e=>e.to===id).filter(e=>!dead.has(e.from)&&!skip.has(e.from+">"+id)&&val[e.from]!=null);
    const vars = (id,input,extra) => Object.assign({input,question,subtask:subtaskFor[id]||"",feedback:"None yet.",debate:transcript||"(nobody has spoken yet)"},extra||{});
    const promptFor = (nd,v) => { let p=fill(nd.cfg.prompt,v); if(!PH.test(nd.cfg.prompt||"")) p+="\n\nInput:\n"+v.input; return p; };

    async function runNode(id){
      const nd=by[id]; const live=liveIn(id);
      if(nd.type!=="in" && !live.length){ dead.add(id); H.status(id,"skipped"); return; }
      live.forEach(e=>H.hot(e.from,id));
      const input=combine(live); inputOf[id]=input;
      if(nd.type==="in"){ val[id]=question; H.status(id,"done"); addStep({id,label:nd.label,type:"in",input:"",output:question,t_start:now(),t_end:now()}); return; }
      if(nd.type==="out"){ val[id]=input; H.status(id,"done"); addStep({id,label:nd.label,type:"out",input,output:input,t_start:now(),t_end:now()}); return; }
      if(nd.type==="gate"){
        const n=words(input), max=nd.cfg.maxWords||60, pass=n<=max;
        D.filter(e=>e.from===id).forEach(e=>{ const fail=/fail/i.test(e.label||""); if(pass===fail) skip.add(id+">"+e.to); });
        val[id]=input; H.status(id,"done"); H.bubble(id,{text:pass?"Pass":"Fail",end:true});
        addStep({id,label:nd.label,type:"gate",input,output:n+" words, maximum "+max+": "+(pass?"pass":"fail"),t_start:now(),t_end:now()}); return; }
      if(nd.type==="router"){
        const targets=D.filter(e=>e.from===id).map(e=>by[e.to]);
        const r=await call(nd, promptFor(nd,vars(id,input))+`\n\nReply with only JSON: {"route": "<one of: ${targets.map(t=>t.label).join(" | ")}>", "why": "one sentence"}`,{json:true,shownInput:input});

    nodes:[IN(80,230),...FINALISTS.map((d,i)=>{ const [x,y]=ring(490,230,170,8,i); return Object.assign(L("d"+(i+1),x,y,d.short,{rounds:2,prompt:dishDebPrompt(d)},130,"debater"),{h:46}); }),
      L("host",830,230,"Judge",{step:"4",model:"claude-sonnet-5-5",prompt:"Step 4 of the workflow (Choose). You are the host and the judge. Eight dishes made their case. Choose one dish that is safe for everyone and fits the budget and time, with what to change in the recipe. Max 80 words. "+ADV+"\n\nCase:\n{{question}}\n\nDiscussion:\n{{debate}}"},110),OUT(950,230)],

const ORDER=["augmented","chain","routing","parallel","orchestrator","evaluator","debate","debate2"];
const TYPE_INFO={in:"What goes into the strategy",out:"The result",llm:"LLM call",worker:"Worker: does one sub-task of the orchestrator",router:"Router: sends the case to one specialist",gate:"Gate: a simple check in code, not an LLM",orchestrator:"Orchestrator: plans sub-tasks for the workers it connects to",evaluator:"Evaluator: checks against criteria, accepts or sends feedback",debater:"Debater: argues every round and answers the others"};

/* ---------- saved state ---------- */
const STORE="ai-playground-v5", MAXRUNS=30;
const SAND_EMPTY=()=>({name:"My strategy",base:"",nodes:[IN(110,200),L("n2",470,200,"LLM call",{prompt:"{{input}}"}),OUT(830,200)],edges:[E("in","n2"),E("n2","out")],seq:3});
let S={mode:"play",tab:"parallel",over:{},sandbox:null,runs:{},view:{},seq:0,knowledge:KNOWLEDGE,memory:[]};
try{ const s=JSON.parse(localStorage.getItem(STORE)||"null"); if(s) S=Object.assign(S,s); }catch(e){}
if(!S.sandbox) S.sandbox=SAND_EMPTY(); if(!ORDER.includes(S.tab)) S.tab="parallel";
function save(){ for(let i=0;i<5;i++){ try{ localStorage.setItem(STORE,JSON.stringify(S)); return; }catch(e){ const k=Object.keys(S.runs).sort((a,b)=>S.runs[b].length-S.runs[a].length)[0]; if(!k||!S.runs[k].length) return; S.runs[k].pop(); } } }
const sand=()=>S.mode==="sand";
const key=()=>sand()?"sandbox":S.tab;
function graph(){ if(sand()) return S.sandbox; const p=PRESETS[S.tab], o=S.over[S.tab]||{};

function setCfg(nd,k,v){ if(sand()){ if(k==="label") nd.label=v; else nd.cfg[k]=v; } else { ((S.over[S.tab] ||= {})[nd.id] ||= {})[k]=v; nd.cfg[k]=v; } save(); }
const runsList=()=>S.runs[key()]||[];

/* ---------- what is shown: a live run, or a saved run ---------- */
let status={}, labels={}, bubbles={}, hot=new Set(), selected=null, selEdge=null, running=false, ctl=null, live=null;
const shown=()=>live||runsList().find(r=>r.run_id===S.view[key()])||runsList()[0]||null;
function restore(){ status={}; labels={}; bubbles={}; hot=new Set(); const r=live?null:shown(); if(r){ Object.assign(status,r.status||{}); Object.assign(labels,r.labels||{}); (r.hot||[]).forEach(k=>hot.add(k)); } }

/* ---------- drawing ---------- */
const svg=$("svg");
function anchor(a,b,p){ const dx=b.x-a.x,dy=b.y-a.y,hw=a.w/2+p,hh=a.h/2+p,t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9); return {x:a.x+dx*t,y:a.y+dy*t}; }
function epath(a,b,bend){ const p1=anchor(a,b,6),p2=anchor(b,a,8),mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1,cx=mx-dy/l*(bend||0)*1.6,cy=my+dx/l*(bend||0)*1.6; return {d:`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,lx:(p1.x+2*cx+p2.x)/4,ly:(p1.y+2*cy+p2.y)/4}; }
const VBH=()=>sand()?Math.max(440,S.sandbox.vbh||0):(graph().vbh||360);
const kind=n=>n.type==="in"||n.type==="out"?"io":(n.type==="gate"?"code":"llm");
function fit(s,w){ const m=Math.floor(w/9.6); return s.length>m?s.slice(0,m-1)+"…":s; }
function sub(n){ if(["aux","in","out"].includes(n.type)) return ""; if(n.type==="gate") return "max "+(n.cfg.maxWords||60)+" words"; const st=String(n.cfg.step||"").trim(); if(!st) return ""; const w=WORKFLOW.find(x=>String(x.n)===st); return "step "+st+(w&&w.label!==n.label?" · "+w.label:""); }
const ARROW=c=>`<marker id="${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--${c==="ah"?"arrow":"live"})" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
function render(){
  const g=graph(), sb=sand(); svg.setAttribute("viewBox","0 0 1000 "+VBH());
  const by=Object.fromEntries(g.nodes.map(n=>[n.id,n]));
  let h=`<defs>${ARROW("ah")}${ARROW("ahh")}</defs>`;
  if(sb) h+=`<rect x="0" y="0" width="1000" height="${VBH()}" fill="transparent"/>`;
  if(g.ring){ const R=g.ring, ringHot=[...hot].some(k=>{ const [a,b]=k.split(">"); return by[a]&&by[b]&&by[a].type==="debater"&&by[b].type==="debater"; });
    h+=`<g class="ring ${ringHot?"hot":""}"><circle cx="${R.x}" cy="${R.y}" r="${R.r}"/><text x="${R.x}" y="${R.y+R.r+44}">${esc(R.label||"")}</text></g>`;
    const a=by[R.from], b=by[R.to];
    if(a){ const k=[...hot].some(x=>x.startsWith(R.from+">")); const p1=anchor(a,{x:R.x,y:R.y},6); const p2={x:R.x-R.r-(R.pad||62),y:R.y};
      h+=`<g class="e ${k?"hot":""}"><path d="M${p1.x},${p1.y} L${p2.x},${p2.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; }
    if(b){ const k=[...hot].some(x=>x.endsWith(">"+R.to)); const p2=anchor(b,{x:R.x,y:R.y},8); const p1={x:R.x+R.r+(R.pad||62),y:R.y};
      h+=`<g class="e ${k?"hot":""}"><path d="M${p1.x},${p1.y} L${p2.x},${p2.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; } }
  g.edges.forEach((e,i)=>{ if(e.hide) return; const a=by[e.from],b=by[e.to]; if(!a||!b) return; const p=epath(a,b,e.bend||0), k=hot.has(e.from+">"+e.to);
    h+=`<g class="e ${e.dash?"dash":""} ${k?"hot":""} ${sb?"click":""} ${sb&&selEdge===i?"sel":""}" data-edge="${i}">${sb?`<path class="hit" d="${p.d}"/>`:""}<path d="${p.d}" marker-end="url(#${k?"ahh":"ah"})"/>${e.label?`<text x="${p.lx.toFixed(1)}" y="${p.ly.toFixed(1)}">${esc(e.label)}</text>`:""}</g>`; });
  g.nodes.forEach(n=>{ const lab=labels[n.id]||n.label, s=sub(n);
    h+=`<g class="n ${kind(n)} ${status[n.id]||""} ${selected===n.id?"sel":""}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(lab)}"><rect x="${n.x-n.w/2}" y="${n.y-n.h/2}" width="${n.w}" height="${n.h}" rx="${kind(n)==="io"?n.h/2:3}"/><text x="${n.x}" y="${n.y-(s?6:0)}">${esc(fit(lab,n.w))}</text>${s?`<text class="sub" x="${n.x}" y="${n.y+14}">${esc(s)}</text>`:""}${sb?`<circle class="handle" data-handle="${esc(n.id)}" cx="${n.x+n.w/2}" cy="${n.y}" r="7"/>`:""}</g>`; });
  h+=bubblesSvg(by); svg.innerHTML=h;
}
function wrapTail(s,w,n){ const ws=String(s||"").replace(/\s+/g," ").trim().split(" "),out=[]; let l=""; for(const x of ws){ if((l+" "+x).trim().length>w){ if(l) out.push(l); l=x; } else l=(l+" "+x).trim(); } if(l) out.push(l); const t=out.slice(-n); if(out.length>n) t[0]="…"+t[0]; return t.map(x=>x.length>w+1?x.slice(0,w)+"…":x); }
function bubblesSvg(by){ let h=""; const vb=VBH(), ring=graph().ring;
  for(const [id,b] of Object.entries(bubbles)){ const n=by[id]; if(!n||!b) continue;
    const L2=b.thinking?[]:wrapTail(b.text,30,2), W=b.thinking?62:210, H=b.thinking?26:L2.length*16+14;
    let x=Math.max(4,Math.min(1000-W-4,n.x-W/2)), above=true, y=n.y-n.h/2-12-H; if(y<4||(ring&&n.type==="debater"&&n.y>ring.y+10)){ above=false; y=n.y+n.h/2+12; } if(y+H>vb-2) y=vb-H-2;
    const tx=Math.max(x+12,Math.min(x+W-12,n.x)); const tail=above?`M${tx-7},${y+H-0.6} L${tx},${y+H+9} L${tx+7},${y+H-0.6}`:`M${tx-7},${y+0.6} L${tx},${y-9} L${tx+7},${y+0.6}`;
    h+=`<g class="bub" aria-hidden="true"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10"/><path d="${tail}"/><rect x="${tx-8}" y="${above?y+H-3:y+1}" width="16" height="3" style="stroke:none;fill:var(--card)"/>`;
    if(b.thinking) h+=`<g><circle class="dot" cx="${x+19}" cy="${y+H/2}" r="3.5"/><circle class="dot" cx="${x+31}" cy="${y+H/2}" r="3.5"/><circle class="dot" cx="${x+43}" cy="${y+H/2}" r="3.5"/></g>`;
    else L2.forEach((l,i)=>{ h+=`<text x="${x+11}" y="${y+8+i*16}">${esc(l)}</text>`; }); h+=`</g>`; }
  return h; }

/* ---------- top: mode, tabs, bar ---------- */

  $("tabs").hidden=sand(); $("palette").hidden=!sand(); $("exportBtn").hidden=!sand(); $("dlRuns").hidden=!sand(); $("resetBtn").hidden=sand();
  $("tabs").innerHTML=ORDER.map(k=>`<button class="tab" type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(PRESETS[k].name)}</button>`).join("");

  const on=sand()?stepsUsed(S.sandbox):(PRESETS[S.tab].steps||[]);
  $("wf").innerHTML=`<b>The workflow</b>`+WORKFLOW.map((w,i)=>`${i?`<span class="ar" aria-hidden="true">→</span>`:""}<span class="st ${on.includes(w.n)?"on":""}" title="${esc(w.what)}">${w.n} ${esc(w.label)}</span>`).join("")+`<span style="margin-left:6px">${sand()?"Green: the steps your boxes do (Step, in the panel of a box).":"Every strategy decides on this same workflow. Step 1, the list of dishes, is in the In box; green: the steps its boxes do."}</span>`;
  $("startFrom").innerHTML=`<option value="">Empty</option>`+ORDER.map(k=>`<option value="${k}">${esc(PRESETS[k].name)}</option>`).join("");

}
function stepsUsed(g){ const s=new Set(); g.nodes.forEach(n=>{ const m=String(n.cfg&&n.cfg.step||"").match(/(\d)(?:\s*[–-]\s*(\d))?/); if(m){ const a=+m[1], b=+(m[2]||m[1]); for(let k=a;k<=b;k++) s.add(k); } }); return [...s]; }
function renderRuns(){ const L2=runsList(), cur=shown();
  $("runs").innerHTML = L2.length ? L2.map(r=>`<option value="${esc(r.run_id)}" ${cur&&!live&&cur.run_id===r.run_id?"selected":""}>Run ${esc(r.run_id)} · ${esc(new Date(r.date_time).toLocaleString([],{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}))}${r.error?" · error":""}</option>`).join("") : `<option value="">No runs yet</option>`;
  $("runs").disabled=!L2.length||running; }
function renderStats(){ const r=live||shown(); $("stats").textContent = live ? "running…" : (r&&r.calls!=null ? `${r.calls} calls · ≈${(r.tokens_est||0).toLocaleString()} tokens (estimate) · ${r.seconds} s` : ""); }
function refresh(){ restore(); renderTop(); render(); renderPanel(); renderStats(); }
document.querySelector(".modes").addEventListener("click",e=>{ const b=e.target.closest("[data-mode]"); if(!b||running) return; S.mode=b.dataset.mode; selected=null; selEdge=null; $("msg").textContent=""; save(); refresh(); });
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b||running) return; S.tab=b.dataset.tab; selected=null; $("msg").textContent=""; save(); refresh(); });
$("runs").addEventListener("change",e=>{ S.view[key()]=e.target.value; save(); refresh(); });
$("resetBtn").addEventListener("click",()=>{ if(running) return; if(sand()){ S.sandbox=SAND_EMPTY(); } else delete S.over[S.tab]; selected=null; save(); refresh(); $("msg").textContent=sand()?"Sandbox emptied.":"Back to the original settings."; });
$("loadBtn").addEventListener("click",()=>{ $("loadConfirm").hidden=false; });
$("loadNo").addEventListener("click",()=>{ $("loadConfirm").hidden=true; });
$("loadYes").addEventListener("click",()=>{ if(running) return; editing=null; const k=$("startFrom").value; S.sandbox = k ? Object.assign({name:PRESETS[k].name+" (my version)",base:k,seq:1},clone({nodes:PRESETS[k].nodes,edges:PRESETS[k].edges,ring:PRESETS[k].ring||undefined,vbh:PRESETS[k].vbh||undefined})) : SAND_EMPTY(); $("loadConfirm").hidden=true; selected=null; save(); refresh(); });

/* ---------- side panel: settings of the clicked box, and what went in and out ---------- */
function stepsOf(id){ const r=shown(); return r&&r.steps?r.steps.filter(s=>s.id===id):[]; }
function ioHtml(id){ const ss=stepsOf(id); if(!ss.length) return "";
  return `<div class="sep">`+ss.map(s=>`<div class="f"><span>${s.round?"Round "+s.round+" · ":""}What went in</span><pre class="out">${esc(s.type==="in"?"(the text above)":(s.input||"(nothing)"))}</pre></div>
    <div class="f"><span>What came out${s.model_answered?" · "+esc(s.model_answered):""}${s.t_end!=null?" · "+((s.t_end-s.t_start)/1000).toFixed(1)+" s":""}</span><pre class="out">${esc(s.output)||"…"}${s.note?"\n\n→ "+esc(s.note):""}</pre></div>`).join("")+`</div>`; }
let editing=null;
function renderPanel(){
  const g=graph(), P=$("panel"), sb=sand();
  if(sb&&editing){ const left=(editing.md.match(/_\(fill in\)_/g)||[]).length;
    P.innerHTML=`<div><h2>${esc(editing.name)}</h2><div class="kind">${left?"Replace every _(fill in)_ with your own answer: "+left+" left.":"Everything is filled in."}</div></div>
      <label class="f"><span>Your strategy file</span><textarea id="edMd" rows="26" spellcheck="true">${esc(editing.md)}</textarea></label>
      <div style="display:flex;gap:8px"><button class="btn run" type="button" id="edSave">Download</button><button class="btn" type="button" id="edClose">Close</button></div>`;
    $("edMd").oninput=e=>{ editing.md=e.target.value; editing.dirty=true; (S.drafts ||= {})[editing.name]=editing.md; save(); };
    $("edSave").onclick=async()=>{ await download(editing.name,editing.md); editing.dirty=false; const m=$("msg"); if(/^Saved/.test(m.textContent)) m.textContent+=" Then type sync in Claude Code: it moves the file from your Downloads folder to the folder of its strategy."; renderPanel(); };
    $("edClose").onclick=()=>{ if(editing.dirty&&!$("edClose").dataset.sure){ $("edClose").dataset.sure="1"; $("edClose").textContent="Close without downloading"; return; } editing=null; renderPanel(); };
    return; }
  if(sb&&selEdge!=null&&g.edges[selEdge]){ const e=g.edges[selEdge];
    P.innerHTML=`<h2>Line</h2><label class="f"><span>Label (a gate follows the line labelled “Fail” when it fails)</span><input type="text" id="eLabel" value="${esc(e.label||"")}"></label><button class="btn" type="button" id="delEdge">Remove this line</button>`;
    $("eLabel").oninput=ev=>{ e.label=ev.target.value; save(); render(); }; $("delEdge").onclick=()=>{ g.edges.splice(selEdge,1); selEdge=null; save(); render(); renderPanel(); }; return; }
  const nd=g.nodes.find(x=>x.id===selected);
  if(!nd){ const r=shown(); P.innerHTML = r&&!live ? `<h2>Output</h2><pre class="out" style="max-height:none">${esc(r.error||r.ai_output)}</pre><p class="hint">Click a box to see what went in and what came out.</p>` : `<div class="empty">Click a box to see and change it.</div>`; return; }
  const c=nd.cfg; let h=`<div><h2>${esc(labels[nd.id]||nd.label)}</h2><div class="kind">${esc(nd.type==="aux"?AUX_INFO[nd.aux]:TYPE_INFO[nd.type])}</div></div>`;
  if(sb&&nd.type!=="aux") h+=`<label class="f"><span>Name</span><input type="text" id="fLabel" value="${esc(nd.label)}"></label>`;
  if(nd.type==="in") h+=`<label class="f"><span>Input</span><textarea id="fInput" rows="9">${esc(c.input||"")}</textarea></label>`;
  else if(nd.type==="gate") h+=`<label class="f"><span>Maximum number of words</span><input type="number" id="fMax" min="1" value="${esc(c.maxWords||60)}"></label>`;
  else if(nd.type==="aux"){ if(nd.aux==="retrieval") h+=`<label class="f"><span>Notes to search (one passage per paragraph)</span><textarea id="fKnow" rows="8">${esc(S.knowledge)}</textarea></label>`;
    if(nd.aux==="memory") h+=`<div class="f"><span>In memory now</span><pre class="out">${esc(S.memory.length?S.memory.map((m,i)=>(i+1)+". "+m).join("\n"):"(empty)")}</pre></div><button class="btn sm" type="button" id="clearMem">Clear memory</button>`; }

      <label class="f"><span>Effort</span><select id="fEffort">${[["","Default"],["low","Low"],["medium","Medium"],["high","High"]].map(([v,t])=>`<option value="${v}" ${v===(c.effort||"")?"selected":""}>${t}</option>`).join("")}</select></label></div>
      ${c.model==="custom"?`<label class="f"><span>Model ID</span><input type="text" id="fCustom" value="${esc(c.customId||"")}" placeholder="e.g. claude-haiku-4-5"></label>`:""}

      <p class="hint">{{input}} what flows in · {{question}} the In text${nd.type==="worker"?" · {{subtask}}":""}${g.nodes.some(n=>n.type==="debater")?" · {{debate}}":""}${g.edges.some(e=>e.loop&&e.to===nd.id)?" · {{feedback}}":""}</p>

  }
  h+=ioHtml(nd.id);
  if(sb&&nd.type!=="aux") h+=`<button class="btn sm" type="button" id="delNode">Delete box</button>`;
  P.innerHTML=h; bind(nd);
}
function bind(nd){
  const on=(id,k,fn)=>{ const el=$(id); if(el) el.addEventListener("input",e=>{ setCfg(nd,k,fn?fn(e.target.value):e.target.value); render(); }); };

  on("fMax","maxWords",v=>Math.max(1,parseInt(v)||1)); on("fRounds","maxRounds",v=>Math.max(1,Math.min(5,parseInt(v)||1)));
  const fd=$("fDeb"); if(fd) fd.addEventListener("input",e=>{ const v=Math.max(1,Math.min(5,parseInt(e.target.value)||1)); graph().nodes.filter(n=>n.type==="debater").forEach(n=>setCfg(n,"rounds",v)); });
  const fm=$("fModel"); if(fm) fm.addEventListener("change",e=>{ setCfg(nd,"model",e.target.value); render(); renderPanel(); });
  const fe=$("fEffort"); if(fe) fe.addEventListener("change",e=>setCfg(nd,"effort",e.target.value));
  document.querySelectorAll("[data-tool]").forEach(cb=>cb.addEventListener("change",()=>{ setCfg(nd,"tools",[...document.querySelectorAll("[data-tool]:checked")].map(x=>x.dataset.tool)); render(); }));
  const k=$("fKnow"); if(k) k.addEventListener("input",e=>{ S.knowledge=e.target.value; save(); });
  const cm=$("clearMem"); if(cm) cm.onclick=()=>{ S.memory=[]; save(); renderPanel(); };
  const dn=$("delNode"); if(dn) dn.onclick=()=>{ const sb=S.sandbox; sb.nodes=sb.nodes.filter(x=>x.id!==nd.id); sb.edges=sb.edges.filter(e=>e.from!==nd.id&&e.to!==nd.id); if(sb.ring&&!sb.nodes.some(n=>n.type==="debater")) delete sb.ring; selected=null; save(); render(); renderPanel(); };
}

/* ---------- editing on the diagram (sandbox) ---------- */
function svgPoint(evt){ const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
let drag=null, link=null;
svg.addEventListener("pointerdown",e=>{
  if(editing&&!editing.dirty) editing=null;
  const sb=sand(), hd=e.target.closest("[data-handle]");
  if(sb&&hd&&!running){ link={from:hd.dataset.handle}; svg.setPointerCapture(e.pointerId); e.preventDefault(); return; }
  const g=e.target.closest("[data-node]");
  if(g){ selected=g.dataset.node; selEdge=null; if(sb&&!running){ const nd=S.sandbox.nodes.find(x=>x.id===selected); const p=svgPoint(e); drag={nd,dx:p.x-nd.x,dy:p.y-nd.y,moved:false}; svg.setPointerCapture(e.pointerId); } render(); renderPanel(); return; }
  const ed=e.target.closest("[data-edge]"); if(sb&&ed){ selEdge=+ed.dataset.edge; selected=null; render(); renderPanel(); return; }
  selected=null; selEdge=null; render(); renderPanel();
});
svg.addEventListener("pointermove",e=>{
  if(drag){ const p=svgPoint(e); drag.nd.x=Math.max(drag.nd.w/2,Math.min(1000-drag.nd.w/2,p.x-drag.dx)); drag.nd.y=Math.max(drag.nd.h/2,Math.min(VBH()-drag.nd.h/2,p.y-drag.dy)); drag.moved=true; render(); }
  if(link){ const p=svgPoint(e); render(); const a=S.sandbox.nodes.find(x=>x.id===link.from); if(a) svg.insertAdjacentHTML("beforeend",`<path class="tmp" d="M${a.x+a.w/2},${a.y} L${p.x},${p.y}"/>`); }
});
svg.addEventListener("pointerup",e=>{
  if(drag){ if(drag.moved) save(); drag=null; }
  if(link){ const el=document.elementFromPoint(e.clientX,e.clientY), g=el&&el.closest&&el.closest("[data-node]");
    if(g&&g.dataset.node!==link.from&&!S.sandbox.edges.some(x=>x.from===link.from&&x.to===g.dataset.node)){ S.sandbox.edges.push({from:link.from,to:g.dataset.node}); save(); }
    link=null; render(); }
});
svg.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ const g=e.target.closest("[data-node]"); if(g){ selected=g.dataset.node; render(); renderPanel(); e.preventDefault(); } } });
$("palette").addEventListener("click",e=>{
  const b=e.target.closest("[data-add]"); if(!b||running) return; const t=b.dataset.add, sb=S.sandbox; let id; do{ id="n"+(++sb.seq); }while(sb.nodes.some(n=>n.id===id));
  const x=690+((sb.nodes.length*150)%200), y=400;
  sb.nodes.push(t==="in"?{id,type:"in",x,y,w:90,h:50,label:"In",cfg:{input:"Your input"}}:t==="out"?{id,type:"out",x,y,w:90,h:50,label:"Out",cfg:{}}:t==="gate"?{id,type:"gate",x,y,w:100,h:56,label:"Gate",cfg:{maxWords:60}}:L(id,x,y,t==="router"?"Router":"LLM call",{prompt:t==="router"?"Decide where this should go.\n\n{{input}}":"{{input}}"},150,t==="router"?"router":"llm"));
  selected=id; save(); render(); renderPanel();
});

/* ---------- run ---------- */
let sample=null, toolsOK=false;
(async()=>{ try{ sample=window.claude&&window.claude.use?await window.claude.use("sample"):null; }catch(e){}
  if(sample){ try{ const lim=await sample.limits(); toolsOK=!!(lim&&lim.tools); }catch(e){} } else { $("runBtn").disabled=true; $("msg").textContent="Open this page in Claude to run it."; } })();
const ERR={not_granted:"You did not allow this page to use Claude. Reload to be asked again.",sampling_disabled:"Claude is not available for this account.",rate_limited:"Too many calls, or your usage limit is reached. Wait and try again.",session_expired:"Sign in to Claude again.",refused:"Claude declined this input. Change it and try again.",empty_completion:"Claude returned nothing. Simplify the prompt.",prompt_too_large:"The input is too long.",cancelled:"Stopped.",upstream_error:"Connection problem. Try again."};
$("runBtn").addEventListener("click",async()=>{
  if(running||!sample) return;
  running=true; selEdge=null; $("runBtn").disabled=true; $("stopBtn").hidden=false; $("msg").textContent=""; $("msg").classList.remove("err");
  const g=clone(graph()), k=key(); ctl=new AbortController(); live={steps:[]}; restore(); render(); renderRuns(); renderStats(); renderPanel();
  const hooks={status:(id,st)=>{ status[id]=st; render(); }, hot:(a,b)=>{ hot.add(a+">"+b); render(); },
    bubble:(id,b)=>{ if(!b) delete bubbles[id]; else { bubbles[id]=b; if(b.end){ const ref=b; setTimeout(()=>{ if(bubbles[id]===ref){ delete bubbles[id]; render(); } },1800); } } render(); },
    label:(id,t)=>{ labels[id]=t; render(); }, step:s=>{ if(!live.steps.includes(s)) live.steps.push(s); if(selected===s.id) renderPanel(); }};
  let res=null, err=null;
  try{ res=await ENGINE.run(g,{sample,toolsOK,knowledge:S.knowledge,memory:S.memory,onMemory:save,signal:ctl.signal,hooks}); }catch(e){ err=e; }
  S.seq=(S.seq||0)+1;
  /* a run keeps everything: settings, every step with what went in and out, the output */
  const rec={run_id:String(S.seq),date_time:new Date().toISOString(),source:sand()?"sandbox":"playground",strategy:sand()?S.sandbox.name:PRESETS[S.tab].name,strategy_version:ENGINE.version(g),
    input:res?res.question:((g.nodes.find(n=>n.type==="in")||{cfg:{}}).cfg.input||""),models_asked:res?res.models_asked.join("; "):"",models_answered:res?res.models_answered.join("; "):"",
    ai_output:res?res.output:"",calls:res?res.calls:live.steps.filter(s=>s.model_asked).length,tokens_est:res?res.tokens_est:0,seconds:res?res.seconds:null,error:err?(err.msg||err.code||"failed"):"",
    settings:g.nodes.filter(n=>n.type!=="aux").map(n=>({id:n.id,label:n.label,type:n.type,model:n.cfg.model==="custom"?n.cfg.customId:n.cfg.model,effort:n.cfg.effort||"",tools:n.cfg.tools||[],prompt:n.cfg.prompt||"",maxWords:n.cfg.maxWords,maxRounds:n.cfg.maxRounds,rounds:n.cfg.rounds})),
    steps:res?res.steps:live.steps,transcript:res?res.transcript:"",status:Object.fromEntries(Object.entries(status).filter(([a,v])=>v==="done"||v==="skipped"||v==="error")),labels:{...labels},hot:[...hot]};
  (S.runs[k] ||= []).unshift(rec); S.runs[k]=S.runs[k].slice(0,MAXRUNS); S.view[k]=rec.run_id;
  running=false; live=null; bubbles={}; $("runBtn").disabled=false; $("stopBtn").hidden=true; save(); refresh();
  if(err){ $("msg").classList.add("err"); $("msg").textContent=err.msg||ERR[err.code]||ERR.upstream_error; }
});
$("stopBtn").addEventListener("click",()=>{ if(ctl) ctl.abort(); });

/* ---------- downloads (sandbox) ---------- */
async function download(name,data){ const m=$("msg"); m.classList.remove("err");
  try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(dl){ await dl.save({filename:name,data}); m.textContent="Saved "+name+"."; return; } }catch(e){ if(e&&e.code){ m.textContent="Not saved."; return; } }
  try{ await navigator.clipboard.writeText(data); m.textContent="Download is not available here, so "+name+" was copied."; }catch(e){ m.textContent="Download is not available in this view."; } }
const slug=s=>String(s||"strategy").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"strategy";
$("dlRuns").addEventListener("click",()=>{ const L2=runsList(); if(!L2.length){ $("msg").textContent="No runs yet."; return; } download("runs-"+slug(S.sandbox.name)+".json",JSON.stringify({exported:new Date().toISOString(),strategy:S.sandbox.name,runs:L2},null,2)); });
/* Export: the file opens here to be filled in, then it is downloaded. "sync" in Claude Code moves it from Downloads
   to the folder of its strategy. Exporting the same strategy again keeps the answers already filled in (kept in this browser). */
function keepFilled(oldMd,newMd){ const FILL="_(fill in)_", old={}; let box="";
  const key=l=>{ const h=l.match(/^### (.+)/); if(h) box=h[1].trim(); else if(/^## /.test(l)) box=""; const m=l.match(/^- ([^:]+): (.*)$/); return m?[box+"|"+m[1],m[1],m[2].trim()]:null; };
  String(oldMd||"").split("\n").forEach(l=>{ const k=key(l); if(k&&k[2]!==FILL&&k[2]) old[k[0]]=k[2]; });
  box=""; return newMd.split("\n").map(l=>{ const k=key(l); return k&&k[2]===FILL&&old[k[0]]?"- "+k[1]+": "+old[k[0]]:l; }).join("\n"); }
$("exportBtn").addEventListener("click",()=>{ if(running) return; const name="strategy-"+slug(S.sandbox.name)+".md";
  editing={name,md:keepFilled((S.drafts||{})[name],strategyMarkdown())}; (S.drafts ||= {})[name]=editing.md; save();
  selected=null; selEdge=null; render(); renderPanel();
  const m=$("msg"); m.classList.remove("err"); m.textContent="Fill in every _(fill in)_ in the file on the right, then click Download."; });

/* the strategy file: only what is needed. The boxes are filled in; the student writes the workflow parts. */
function strategyMarkdown(){
  const g=S.sandbox, by=Object.fromEntries(g.nodes.map(n=>[n.id,n])), FILL="_(fill in)_";
  const isAgent=n=>!["in","out","aux"].includes(n.type);
  const flow=g.edges.filter(e=>by[e.from]&&by[e.to]&&by[e.from].type!=="aux"&&by[e.to].type!=="aux"&&!(by[e.from].type==="debater"&&by[e.to].type==="debater"));
  const sends=id=>flow.filter(e=>e.from===id).map(e=>by[e.to].label+(e.loop?" (line: "+(e.label||"Rejected")+", goes back)":(e.label?" (line: "+e.label+")":""))).join(", ")||"nothing";
  const deb=g.nodes.filter(n=>n.type==="debater");
  const box=n=>{ const c=n.cfg; if(n.type==="gate") return "### "+n.label+"\n- Type: gate (a check in code, no LLM): passes when the text has at most "+(c.maxWords||60)+" words; when it fails, the flow follows the line Fail\n- Tab of my dashboard: "+FILL+"\n- Sends to: "+sends(n.id)+"\n";
    return "### "+n.label+"\n- Type: "+n.type+"\n- Tab of my dashboard: "+FILL+"\n- Model: `"+(c.model==="custom"?c.customId:c.model)+"`, effort: "+(c.effort||"default")+((c.tools||[]).length?", tools: "+c.tools.join(", "):"")
      +(n.type==="evaluator"?", maximum rounds: "+(c.maxRounds||3):"")+(n.type==="debater"?", rounds: "+(c.rounds||2):"")+"\n- Sends to: "+sends(n.id)+"\n- Prompt:\n\n```text\n"+c.prompt+"\n```\n"; };
  const ins=g.nodes.filter(n=>n.type==="in");
  return "# Strategy: "+g.name+"\n\n"+(g.base?"Based on: "+PRESETS[g.base].name+". ":"")+"Exported "+new Date().toLocaleDateString()+". Fill in every "+FILL+" in this file. Then type sync in Claude Code: the file goes to the folder of its strategy.\n\n"
    +"## My workflow\n\n- Workflow: "+FILL+"\n- Decision at the end: "+FILL+"\n- Possible outcomes: "+FILL+"\n- Why this strategy fits: "+FILL+"\n- Who decides (the AI advises, or the AI decides and I can override): "+FILL+"\n- What from my dashboard goes into In: "+FILL+"\n\n"
    +"## Boxes\n\n"+ins.map(n=>"### "+n.label+"\n- Type: in\n- Sends to: "+sends(n.id)+"\n").join("\n")+"\n"+g.nodes.filter(isAgent).map(box).join("\n")
    +(deb.length>1?"\nThe debaters ("+deb.map(n=>n.label).join(", ")+") answer each other in every round.\n":"")
    +(g.nodes.some(n=>(n.cfg.tools||[]).includes("retrieval"))?"\n## Notes for retrieval\n\n```text\n"+S.knowledge+"\n```\n":"");
}

refresh();
})();
</script>
