<title>Dinner Planner · __STRAT_NAME__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a student's workflow dashboard (example: planning dinner for guests with different diets) (one tab per step) as a separate agentic version for ONE strategy. Under the tabs: the AI flow (In to Out, live). Left: the tab, with the agent that works on this step on top and the original content below. Right: the agents' conversation, every step with what went in and what came out. Top right, next to Run: a small dropdown with the evaluation tests; each test makes its own change automatically (an extra prompt), runs 3 times and logs everything. Under the flow: the advice of the run shown. The run log is downloaded for the findings. */
:root{
  --page:#f0eee6; --card:#ffffff; --ink:#1f1e1b; --muted:#6f6c64; --line:#e3e0d6;
  --green-fill:#eef4e7; --green-line:#b7d29c; --green-ink:#5b8a30;
  --io-fill:#f8e8e1; --io-line:#e8b7a4; --io-ink:#c2572f;
  --code-fill:#eceaf6; --code-line:#b9b3dc; --code-ink:#5a4fa3;
  --arrow:#a7a49c; --live:#d38a22; --live-fill:#fbefd9; --bad:#b9412f; --accent:#c2572f;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1b1a17; --card:#24231f; --ink:#ecebe6; --muted:#a9a59b; --line:#3a3832;
  --green-fill:#25301c; --green-line:#5d7c3e; --green-ink:#a9d27b; --io-fill:#3a2620; --io-line:#8a4e39; --io-ink:#f0a184;
  --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0; --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1b1a17; --card:#24231f; --ink:#ecebe6; --muted:#a9a59b; --line:#3a3832;
  --green-fill:#25301c; --green-line:#5d7c3e; --green-ink:#a9d27b; --io-fill:#3a2620; --io-line:#8a4e39; --io-ink:#f0a184;
  --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0; --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
button,select,input,textarea{font:inherit;color:inherit} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0} header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.badge .k{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tab .n{font-family:var(--f-mono);font-size:12px}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--line)} .tab .dot.running{background:var(--live)} .tab .dot.done{background:var(--green-ink)}
.card{background:var(--card);border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.flowcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:3px} .f>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.f select,.f input,.f textarea{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.run{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600} .btn:disabled{opacity:.5;cursor:default} .btn.sm{padding:4px 10px;font-size:13px}
.svgbox{overflow-x:auto} svg.d{display:block;width:100%;min-width:600px;height:auto;max-height:330px;user-select:none}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted)} .msg{font-size:13px;color:var(--green-ink)} .msg.err{color:var(--bad)}
.n rect{stroke-width:1.2} .n.llm rect{fill:var(--green-fill);stroke:var(--green-line)} .n.llm text{fill:var(--green-ink)}
.n.io rect{fill:var(--io-fill);stroke:var(--io-line)} .n.io text{fill:var(--io-ink)} .n.code rect{fill:var(--code-fill);stroke:var(--code-line)} .n.code text{fill:var(--code-ink)}
.n text{font-family:var(--f-ui);font-weight:600;font-size:17px;dominant-baseline:central;text-anchor:middle;pointer-events:none} .n text.sub{font-size:11px;font-weight:500;fill:var(--muted)}
.n{cursor:pointer} .n.cur rect{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.n.running rect{stroke:var(--live);stroke-width:2.5;fill:var(--live-fill)} .n.done rect{stroke-width:2} .n.skipped{opacity:.3} .n.error rect{stroke:var(--bad)}
@media (prefers-reduced-motion:no-preference){.n.running rect{animation:pulse 1.2s ease-in-out infinite}} @keyframes pulse{50%{stroke-width:4}}
.e path{fill:none;stroke:var(--arrow);stroke-width:1.6} .e.dash path{stroke-dasharray:4 5} .e.hot path{stroke:var(--live);stroke-width:2.2}
.ring circle{fill:none;stroke:var(--arrow);stroke-width:1.6;stroke-dasharray:4 5} .ring.hot circle{stroke:var(--live);stroke-width:2.2} .ring text{font-family:var(--f-ui);font-size:12px;fill:var(--muted);text-anchor:middle}
.e text{font-family:var(--f-ui);font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--card);stroke-width:5px}
.bub rect,.bub path{fill:var(--card);stroke:var(--arrow);stroke-width:1.2} .bub text{font-family:var(--f-ui);font-size:12.5px;fill:var(--ink);dominant-baseline:hanging} .bub .dot{fill:var(--live)}
@media (prefers-reduced-motion:no-preference){.bub .dot{animation:blink 1.1s infinite}.bub .dot:nth-child(2){animation-delay:.18s}.bub .dot:nth-child(3){animation-delay:.36s}} @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:1fr}}
.panel{padding:16px}
.panel h2{margin:0 0 10px;font-size:17px}
.agent{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start;border:1px dashed var(--green-line);border-radius:10px;padding:12px;background:color-mix(in srgb,var(--green-fill) 40%,transparent);margin-bottom:14px}
@media (max-width:640px){.agent{grid-template-columns:1fr}}
.abox{border:1.5px solid var(--green-line);background:var(--green-fill);border-radius:4px;padding:8px 10px;text-align:center} .abox b{display:block;color:var(--green-ink)} .abox span{font-size:11.5px;color:var(--muted)}
.abox.running{border-color:var(--live);background:var(--live-fill)}
.alabel{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.bubble{position:relative;background:var(--card);border:1px solid var(--arrow);border-radius:12px;padding:8px 12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:640px){.grid2{grid-template-columns:1fr}}
.tablebox{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--muted);font-weight:600;font-size:12px}
td.num{font-family:var(--f-mono);text-align:right} td.cut{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:inline-block;height:8px;background:var(--green-line);border-radius:4px}
.hint{color:var(--muted);font-size:13px;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px} .opt{display:flex;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}

/* the agents' conversation */
.convo{padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.convo h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{display:flex;flex-direction:column;gap:3px}
.m .who{font-size:12px;font-weight:600;color:var(--green-ink);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline} .m .who small{font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.m .txt{background:var(--green-fill);border:1px solid var(--green-line);border-radius:4px 12px 12px 12px;padding:8px 11px;white-space:pre-wrap;font-size:13.5px}
.m.io .who{color:var(--io-ink)} .m.io .txt{background:var(--io-fill);border-color:var(--io-line)}
.m.sys .txt{background:var(--code-fill);border-color:var(--code-line);font-family:var(--f-mono);font-size:12px}
.m.sys .who{color:var(--code-ink)}
.m.running .txt{border-color:var(--live);background:var(--live-fill)}
.m details{font-size:12px} .m summary{cursor:pointer;color:var(--muted)}
.m pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:7px;margin:4px 0;max-height:220px;overflow:auto}
.round{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:6px}

.gate{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.pill{background:var(--green-fill);color:var(--green-ink);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px}
.ctl .sm{font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);max-width:230px} .ctl .f.mini>span{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.tdet{font-size:12.5px;color:var(--muted)} .tdet summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap} .tdet summary::-webkit-details-marker{display:none} .tdet summary::before{content:"▸";font-size:10px} .tdet[open] summary::before{content:"▾"}
.tdet .body{margin-top:8px;border-left:2px solid var(--code-line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:8px;color:var(--ink)} .tdet textarea{width:100%;font-family:var(--f-mono);font-size:12px;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:7px} .tdet pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;margin:0;max-height:160px;overflow:auto}
.done{color:var(--green-ink);font-weight:600}
.advice{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px} .advice .big{font-size:17px;font-weight:700} .advice details{font-size:13px} .advice summary{cursor:pointer;color:var(--muted)} .advice pre{white-space:pre-wrap;font-family:var(--f-ui);font-size:13.5px;margin:6px 0 0}
.coding{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} @media (max-width:640px){.coding{grid-template-columns:1fr 1fr}}
h3{margin:18px 0 6px;font-size:14px}
</style>

<div class="wrap">
  <header>
    <div><h1>Dinner Planner</h1><p>Agentic version · invented example</p></div>
    <div class="badge" title="The AI strategy built into this dashboard"><span class="k">__STRAT_KEY__</span>__STRAT_NAME__</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Workflow steps"></nav>

  <section class="card flowcard" aria-label="AI flow">
    <div class="top"><h2>AI flow · __STRAT_NAME__ · from In to Out</h2>
      <div class="ctl">
        <label class="f mini"><span>Run shown</span><select class="sm" id="runSel"></select></label>
        <span class="vsep" aria-hidden="true"></span>
        <label class="f mini"><span>Evaluation test</span><select class="sm" id="testSel"></select></label>
        <button class="btn sm" type="button" id="testRun">Run test</button>
        <button class="btn sm" type="button" id="dlLog" title="Downloads the run log as CSV and JSON, for sync and findings">Download log</button>
        <span class="vsep" aria-hidden="true"></span>
        <button class="btn run" type="button" id="runBtn" title="One run with the data of the tabs. Not part of the evaluation.">Run</button><button class="btn" type="button" id="stopBtn" hidden>Stop</button>
      </div></div>
    <details class="tdet" id="tdet"><summary id="tsum"></summary><div class="body" id="tbody"></div></details>
    <div class="svgbox"><svg class="d" id="flow" role="img" aria-label="Agent flow"></svg></div>
    <div class="top"><span class="msg" id="msg" aria-live="polite">Click a box to open its step.</span><span class="stats" id="stats"></span></div>
    <div class="advice" id="advice"></div>
  </section>

  <div class="main">
    <section class="card panel" id="panel"></section>
    <aside class="card convo" aria-label="What the agents say"><h2>What the agents say · in and out per step</h2><div class="msgs" id="msgs"></div></aside>
  </div>
</div>

<script>
/*__ENGINE__*/
(() => {
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---- the student's workflow data (invented) ---- */
const DISHES=[
  {name:"Vegetable curry with rice",key:"curry",cost:14,min:40,kitchen:"two hobs",with:"cashew nuts, cream",tags:["nuts","lactose"],spicy:true},
  {name:"Pasta pesto",key:"pesto",cost:10,min:20,kitchen:"two hobs",with:"pine nuts, parmesan",tags:["nuts","lactose"],spicy:false},
  {name:"Mushroom risotto",key:"risotto",cost:16,min:45,kitchen:"one hob",with:"mushrooms, butter, parmesan",tags:["mushrooms","lactose"],spicy:false},
  {name:"Chickpea and tomato stew with bread",key:"stew",cost:12,min:35,kitchen:"one hob",with:"vegan",tags:[],spicy:false}];
const GUESTS=[{name:"Anna",diet:"vegetarian",avoid:["meat"]},{name:"Ben",diet:"allergic to nuts",avoid:["nuts"]},{name:"Chloé",diet:"loves spicy food, does not like mushrooms",avoid:["mushrooms"]},{name:"David",diet:"lactose intolerant",avoid:["lactose"]}];
const STEPS=[{id:"guests",n:1,label:"Guests"},{id:"dishes",n:2,label:"Dishes"},{id:"diets",n:3,label:"Diets"},{id:"budget",n:4,label:"Budget & time"}];
/* the possible outcomes, read from the line "Advice: <outcome>" */
const OUTCOMES=DISHES.map(d=>({name:d.name,keys:[d.key]}));
/* ---- the strategy, rebuilt from the "Boxes" section of the student's strategy file ---- */
const STRATEGY=/*__STRATEGY_JSON__*/;
/* which tab each box works on ("Tab of my dashboard" in the file, confirmed by the student) */
const STEP_OF=/*__STEP_OF__*/;
const G={nodes:STRATEGY.nodes,edges:STRATEGY.edges};
STRATEGY.version=STRATEGY.version||ENGINE.version(G);
/* ---- automatic layout: columns by step in the flow, debaters on a circle, tool boxes under their LLM ---- */
(function layout(){
  const by0=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  G.nodes.forEach(n=>{ n.w=n.w||(n.type==="in"||n.type==="out"?84:n.type==="debater"?110:Math.max(110,Math.min(200,(n.label.length+3)*10+16))); n.h=n.h||(n.type==="in"||n.type==="out"?46:54); });
  if(G.nodes.every(n=>n.x!=null)) return;
  const flow=G.edges.filter(e=>by0[e.from]&&by0[e.to]&&!e.loop&&by0[e.from].type!=="aux"&&by0[e.to].type!=="aux"&&!(by0[e.from].type==="debater"&&by0[e.to].type==="debater"));
  const depth={}; G.nodes.forEach(n=>{ if(n.type==="in") depth[n.id]=0; });
  for(let k=0;k<G.nodes.length;k++) flow.forEach(e=>{ if(depth[e.from]!=null) depth[e.to]=Math.max(depth[e.to]??0,depth[e.from]+1); });
  const deb=G.nodes.filter(n=>n.type==="debater"), ring=deb.length>1;
  const cols=[]; G.nodes.forEach(n=>{ if(n.type!=="aux"&&!(ring&&n.type==="debater")) (cols[depth[n.id]??0] ||= []).push(n); });
  const R=110, dd=ring?(depth[deb[0].id]??1):-1; let x=70, cx=0;
  const nCol=Math.max(cols.length,dd+1);
  for(let d=0;d<nCol;d++){ const col=cols[d]||[];
    if(d===dd){ cx=x+R+70; x=cx+R+140; }
    const wmax=Math.max(0,...col.map(n=>n.w)); col.forEach((n,i)=>{ n.x=(d===dd?cx:x+wmax/2); n.y=220+(i-(col.length-1)/2)*Math.max(95,R*2/Math.max(1,col.length-1)); });
    if(d!==dd) x+=wmax+80; }
  if(ring){ deb.forEach((n,i)=>{ const a=-Math.PI/2+i*2*Math.PI/deb.length; n.x=cx+R*Math.cos(a); n.y=220+R*Math.sin(a); });
    const from=flow.find(e=>e.to===deb[0].id), to=flow.find(e=>e.from===deb[0].id);
    G.ring={x:cx,y:220,r:R,label:(deb[0].cfg.rounds||2)+" rounds: they answer each other",from:from&&from.from,to:to&&to.to};
    G.edges.forEach(e=>{ if((by0[e.from]&&by0[e.from].type==="debater")||(by0[e.to]&&by0[e.to].type==="debater")) e.hide=1; }); }
  G.nodes.filter(n=>n.type==="aux").forEach((n,i,all)=>{ const e=G.edges.find(e=>e.from===n.id||e.to===n.id), host=e&&by0[e.from===n.id?e.to:e.from]||G.nodes[1]; n.w=110; n.h=46; n.x=host.x+(i-(all.length-1)/2)*170; n.y=host.y+170; });
})();
const by=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
const agentsOn=step=>G.nodes.filter(n=>STEP_OF[n.id]===step);

/* ---- the dashboard data become the In box ---- */
function caseText(){ return "What do we cook tonight? Four friends come for dinner.\nBudget: €"+ST.budget+". Time: "+ST.minutes+" minutes. Kitchen: "+ST.kitchen+".\nGuests:\n"+GUESTS.map(g=>`- ${g.name}: ${g.diet}`).join("\n")+"\nOptions:\n"+DISHES.map(d=>`- ${d.name}: €${d.cost}, ${d.min} min, ${d.kitchen}, ${d.spicy?"spicy, ":""}${d.with==="vegan"?"vegan":"with "+d.with}`).join("\n"); }

/* ---- saved state ---- */
const KEY="ai-dash-"+STRATEGY.version;
const ST={tab:"guests",budget:30,minutes:45,kitchen:"one oven, two hobs",log:[],review:null,seq:0,test:"baseline",extra:{},vars:{},evalInput:null};
try{ Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };

/* ---- what the flow shows: a live run or the selected saved run ---- */
let status={}, labels={}, bubbles={}, hot=new Set(), running=false, ctl=null, live=null;
const shownRun=()=>live||(ST.review!=null?ST.log[ST.review]:null);
function restore(r){ status={}; labels={}; bubbles={}; hot=new Set(); if(r){ Object.assign(status,r.status||{}); Object.assign(labels,r.labels||{}); (r.hot||[]).forEach(k=>hot.add(k)); } }

/* ---- flow drawing (same look as the playground) ---- */
function anchor(a,b,p){ const dx=b.x-a.x,dy=b.y-a.y,hw=a.w/2+p,hh=a.h/2+p,t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9); return {x:a.x+dx*t,y:a.y+dy*t}; }
function epath(a,b,bend){ const p1=anchor(a,b,6),p2=anchor(b,a,8),mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1,cx=mx-dy/l*(bend||0)*1.6,cy=my+dx/l*(bend||0)*1.6; return {d:`M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`,lx:(p1.x+2*cx+p2.x)/4,ly:(p1.y+2*cy+p2.y)/4}; }
const kind=n=>n.type==="in"||n.type==="out"?"io":(n.type==="gate"?"code":"llm");
const MN={"claude-haiku-5-5":"Haiku 5.5","claude-sonnet-5-5":"Sonnet 5.5","claude-opus-5-5":"Opus 5.5"};
const mname=c=>c.model==="custom"?(c.customId||"Other model"):(MN[c.model]||c.model);
function wrapTail(s,w,n){ const ws=String(s||"").replace(/\s+/g," ").trim().split(" "),out=[]; let l=""; for(const x of ws){ if((l+" "+x).trim().length>w){ if(l) out.push(l); l=x; } else l=(l+" "+x).trim(); } if(l) out.push(l); const t=out.slice(-n); if(out.length>n) t[0]="…"+t[0]; return t; }
function renderFlow(){
  const xs=G.nodes.flatMap(n=>[n.x-n.w/2,n.x+n.w/2]), ys=G.nodes.flatMap(n=>[n.y-n.h/2,n.y+n.h/2]);
  const x0=Math.min(0,Math.min(...xs)-10), x1=Math.max(1000,Math.max(...xs)+10), y0=Math.max(0,Math.min(...ys)-64), y1=Math.max(...ys)+(G.ring?70:24);
  $("flow").setAttribute("viewBox",`${x0} ${y0} ${x1-x0} ${y1-y0}`);
  let h=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--arrow)" stroke-width="1.6"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--live)" stroke-width="1.8"/></marker></defs>`;
  if(G.ring){ const R=G.ring, rh=[...hot].some(k=>{ const [a,b]=k.split(">"); return by[a]&&by[b]&&by[a].type==="debater"&&by[b].type==="debater"; });
    h+=`<g class="ring ${rh?"hot":""}"><circle cx="${R.x}" cy="${R.y}" r="${R.r}"/><text x="${R.x}" y="${R.y+R.r+44}">${esc(R.label||"")}</text></g>`;
    const a=by[R.from], b=by[R.to];
    if(a){ const k=[...hot].some(x=>x.startsWith(R.from+">")); const p1=anchor(a,{x:R.x,y:R.y},6); h+=`<g class="e ${k?"hot":""}"><path d="M${p1.x},${p1.y} L${R.x-R.r-62},${R.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; }
    if(b){ const k=[...hot].some(x=>x.endsWith(">"+R.to)); const p2=anchor(b,{x:R.x,y:R.y},8); h+=`<g class="e ${k?"hot":""}"><path d="M${R.x+R.r+62},${R.y} L${p2.x},${p2.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; } }
  G.edges.forEach(e=>{ if(e.hide) return; const a=by[e.from],b=by[e.to]; if(!a||!b) return; const p=epath(a,b,e.bend||0), k=hot.has(e.from+">"+e.to);
    h+=`<g class="e ${e.dash?"dash":""} ${k?"hot":""}"><path d="${p.d}" marker-end="url(#${k?"ahh":"ah"})"/>${e.label?`<text x="${p.lx}" y="${p.ly}">${esc(e.label)}</text>`:""}</g>`; });
  G.nodes.forEach(n=>{ const st=STEPS.find(s=>s.id===STEP_OF[n.id]); const lab=(st?st.n+"  ":"")+(labels[n.id]||n.label); const sub=n.type==="aux"||kind(n)==="io"?"":(n.type==="gate"?"max "+n.cfg.maxWords+" words":mname(n.cfg));
    h+=`<g class="n ${kind(n)} ${status[n.id]||""} ${STEP_OF[n.id]===ST.tab?"cur":""}" data-go="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(lab)}"><rect x="${n.x-n.w/2}" y="${n.y-n.h/2}" width="${n.w}" height="${n.h}" rx="${kind(n)==="io"?n.h/2:3}"/><text x="${n.x}" y="${n.y-(sub?6:0)}">${esc(lab.length>n.w/9.6?lab.slice(0,Math.floor(n.w/9.6)-1)+"…":lab)}</text>${sub?`<text class="sub" x="${n.x}" y="${n.y+14}">${esc(sub)}</text>`:""}</g>`; });
  for(const [id,b] of Object.entries(bubbles)){ const n=by[id]; if(!n||!b) continue; const L=b.thinking?[]:wrapTail(b.text,30,2), W=b.thinking?62:210, H=b.thinking?26:L.length*16+14;
    const below=G.ring&&n.type==="debater"&&n.y>G.ring.y+10;
    const x=Math.max(x0+4,Math.min(x1-W-4,n.x-W/2)), y=below?n.y+n.h/2+12:Math.max(y0+2,n.y-n.h/2-12-H), tx=Math.max(x+12,Math.min(x+W-12,n.x));
    h+=`<g class="bub"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10"/><path d="${below?`M${tx-7},${y+0.6} L${tx},${y-9} L${tx+7},${y+0.6}`:`M${tx-7},${y+H-0.6} L${tx},${y+H+9} L${tx+7},${y+H-0.6}`}"/><rect x="${tx-8}" y="${below?y+1:y+H-3}" width="16" height="3" style="stroke:none;fill:var(--card)"/>`;
    if(b.thinking) h+=`<g><circle class="dot" cx="${x+19}" cy="${y+13}" r="3.5"/><circle class="dot" cx="${x+31}" cy="${y+13}" r="3.5"/><circle class="dot" cx="${x+43}" cy="${y+13}" r="3.5"/></g>`; else L.forEach((l,i)=>h+=`<text x="${x+11}" y="${y+8+i*16}">${esc(l)}</text>`); h+=`</g>`; }
  $("flow").innerHTML=h;
  const r=shownRun(); $("stats").textContent = r&&r.calls!=null ? `${r.calls} calls · ≈${(r.tokens_est||0).toLocaleString()} tokens (estimate) · ${r.seconds} s${r.run_id?" · run "+r.run_id:""}` : (live?"running…":"");
}
const goNode=id=>{ const n=by[id]; ST.tab = n.type==="in"?STEPS[0].id:(n.type==="out"?ST.tab:(STEP_OF[id]||ST.tab)); save(); render(); };
$("flow").addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g) goNode(g.dataset.go); });
$("flow").addEventListener("keydown",e=>{ const g=e.target.closest("[data-go]"); if(g&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); goNode(g.dataset.go); } });

/* ---- the agents' conversation: every step, with what went in and what came out ---- */
function renderMsgs(){
  const r=shownRun(), S=r?r.steps||[]:[];
  if(!S.length){ $("msgs").innerHTML=`<p class="hint">Press Run. Every step appears here: what the In box sends, what each agent says (and what it received), every check and tool, and what reaches Out.</p>`; return; }
  let lastRound=null, h="";
  S.forEach(s=>{
    if(s.round&&s.round!==lastRound&&s.type==="debater"){ h+=`<div class="round">Round ${s.round}</div>`; } if(s.type==="debater") lastRound=s.round;
    const tab=STEPS.find(t=>t.id===STEP_OF[s.id]);
    if(s.type==="in"){ h+=`<div class="m io"><div class="who">In <small>from the tabs · the case</small></div><div class="txt">${esc(s.output)}</div></div>`; return; }
    if(s.type==="out"){ h+=`<div class="m io"><div class="who">Out <small>the advice</small></div><div class="txt">${esc(s.output)}</div></div>`; return; }
    if(s.type==="gate"||s.type==="tool"){ h+=`<div class="m sys"><div class="who">${esc(s.label)}</div><div class="txt">${esc(s.input?s.input+"\n→ ":"")}${esc(String(s.output).slice(0,600))}</div></div>`; return; }
    h+=`<div class="m ${s.t_end==null?"running":""}"><div class="who">${esc(s.label)}${tab?` <small>step ${tab.n}</small>`:""}${s.round?` <small>round ${s.round}</small>`:""} <small>${esc(s.model_answered||s.model_asked||"")}${s.t_end!=null?" · "+((s.t_end-s.t_start)/1000).toFixed(1)+" s":""}</small></div>
      <div class="txt">${esc(s.output)||"…"}${s.note?"\n\n→ "+esc(s.note):""}</div>
      <details><summary>What it received</summary><pre>${esc(s.input||"(nothing)")}</pre><details><summary>Full prompt sent</summary><pre>${esc(s.prompt||"")}</pre></details></details></div>`;
  });
  $("msgs").innerHTML=h;
}

/* ---- tabs and panel ---- */
function renderTabs(){ $("tabs").innerHTML=STEPS.map(s=>{ const ag=agentsOn(s.id); const st=ag.some(n=>status[n.id]==="running")?"running":(ag.length&&ag.every(n=>status[n.id]==="done")?"done":""); return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${ST.tab===s.id}"><span class="n">${s.n}</span>${esc(s.label)}${ag.length?`<span class="dot ${st}" aria-hidden="true"></span>`:""}</button>`; }).join(""); }
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; ST.tab=b.dataset.tab; save(); render(); });
function agentCards(step){
  const r=shownRun(); return agentsOn(step).map(n=>{ const ss=r?(r.steps||[]).filter(s=>s.id===n.id):[]; const last=ss[ss.length-1]; const st=status[n.id]||"";
    const body = live&&st==="running"&&!(bubbles[n.id]&&bubbles[n.id].text) ? "…" : (bubbles[n.id]&&bubbles[n.id].text&&st==="running" ? bubbles[n.id].text : (last?last.output+(last.note?"\n\n→ "+last.note:""):"Press Run. This agent does this step."));
    return `<div class="agent"><div class="abox ${st}"><b>${esc(labels[n.id]||n.label)}</b><span>${esc(n.type)} · ${esc(mname(n.cfg))} · ${esc(st||"idle")}</span></div><div><div class="alabel">What the agent says${ss.length>1?" (last of "+ss.length+")":""}</div><div class="bubble">${esc(body)}</div>${last?`<details style="margin-top:6px;font-size:12px"><summary style="cursor:pointer;color:var(--muted)">What it received</summary><pre style="white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px">${esc(last.input)}</pre></details>`:""}</div></div>`; }).join("");
}
const ok=(g,d)=>!d.tags.some(t=>g.avoid.includes(t));

  if(id==="diets") return `<h2>3 · Diets</h2><div class="tablebox"><table><thead><tr><th>Dish</th>${GUESTS.map(g=>`<th>${esc(g.name)}</th>`).join("")}</tr></thead><tbody>${DISHES.map(d=>`<tr><td>${esc(d.name)}</td>${GUESTS.map(g=>`<td>${ok(g,d)?"OK":"<b>no</b>"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(id==="budget") return `<h2>4 · Budget and time</h2><div class="tablebox"><table><thead><tr><th>Dish</th><th>€</th><th>Budget €${ST.budget}</th><th>Minutes</th><th>Time ${ST.minutes} min</th></tr></thead><tbody>${DISHES.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${d.cost}</td><td>${d.cost<=ST.budget?"within":"<b>over</b>"}</td><td class="num">${d.min}</td><td>${d.min<=ST.minutes?"in time":"<b>too long</b>"}</td></tr>`).join("")}</tbody></table></div>`;
  return "";

/* ---- the evaluation tests: one button each, next to Run. Each test makes ONE change automatically,
   with an extra prompt the student can read and edit, and runs RUNS_PER_TEST times on the same input. ---- */
const RUNS_PER_TEST=3;
const LLM_TYPES=["llm","worker","router","orchestrator","evaluator","debater"];
const llmNodes=()=>G.nodes.filter(n=>LLM_TYPES.includes(n.type));
const feeders=()=>llmNodes().filter(n=>G.edges.some(e=>e.from===n.id&&!e.loop&&by[e.to]&&LLM_TYPES.includes(by[e.to].type)));
const ALL_TESTS=[
  {type:"baseline",label:"Baseline",step:"Document, Compare (TIA)",q:"What exactly produced this result? Do repeated runs give the same outcome?",change:"Nothing changes. Every other test is compared with this one.",extra:""},
  {type:"wording",label:"Wording",step:"Vary (prompt variation)",q:"Does changing the order or wording of the prompts change the outcome?",change:"Every prompt is reworded by one extra call, with the same meaning.",
    extra:"Reword each of these prompts. Keep the meaning, every {{placeholder}} and the instruction to end with the line \"Advice: ...\". Change the order of the sentences and the words."},
  {type:"fact",label:"Fact",step:"Vary (counterfactual)",q:"Does changing one decisive fact in the input change the outcome?",change:"One extra call changes one fact in the input that should change the advice.",
    extra:"Change exactly one fact in this case that should change the advice, for example a budget, a size, a date or a requirement. Change nothing else."},
  {type:"boundary",label:"Boundary",step:"Vary (boundary testing)",q:"With missing or conflicting information, does it flag uncertainty, or make things up?",change:"One extra call removes one piece of information, or adds one that contradicts another.",
    extra:"Remove one piece of information that the advice depends on, or add one sentence that contradicts another fact in the case. Change nothing else."},
  {type:"model",label:"Models",step:"Compare (CSA, models)",q:"How do models differ on the same case?",change:"Every box gets the next model up: Haiku → Sonnet, Sonnet → Opus, Opus → Sonnet. No extra call.",extra:""},
  {type:"agents",label:"Agents",step:"Compare (ISIA)",q:"Do the boxes influence each other, and do errors spread?",change:"One extra call picks one box that passes its answer on, and gives it one wrong fact.",
    extra:"Choose one box whose answer goes to another box, and write one plausible but wrong fact about this case for it to assume, for example that the budget is twice as high."}];
const TESTS=ALL_TESTS.filter(t=>t.type!=="agents"||(llmNodes().length>1&&feeders().length));
const doneOf=t=>ST.log.filter(l=>l.variation_type===t&&!l.error).length;
const allDone=()=>TESTS.every(t=>doneOf(t.type)>=RUNS_PER_TEST);
const clone=o=>JSON.parse(JSON.stringify(o));
const parseJ=t=>{ const m=String(t).match(/\{[\s\S]*\}/); try{ return JSON.parse(m?m[0]:t); }catch(e){ return null; } };
const UP={"claude-haiku-5-5":"claude-sonnet-5-5","claude-sonnet-5-5":"claude-opus-5-5","claude-opus-5-5":"claude-sonnet-5-5"};
async function extraCall(prompt){ const r=await sample(prompt,{signal:ctl.signal,modelTier:"default",model:"claude-sonnet-5-5",cache:false}); return r.text; }
/* makes the change of one test, once; every run of that test then uses the same change */
async function makeVariation(t,input){
  const extra=(ST.extra[t]!=null?ST.extra[t]:(ALL_TESTS.find(x=>x.type===t)||{}).extra)||"";
  const v={type:t,extra_prompt:extra,extra_output:"",what:"",input,changes:{}};
  if(t==="baseline") return v;
  if(t==="model"){ llmNodes().forEach(n=>{ const to=UP[n.cfg.model]||"claude-sonnet-5-5"; v.changes[n.id]={model:to}; }); v.what="every box one model up: "+llmNodes().map(n=>n.label+" "+mname(n.cfg)+" → "+mname({model:v.changes[n.id].model})).join(", "); return v; }
  if(t==="wording"){ const P=Object.fromEntries(llmNodes().map(n=>[n.id,n.cfg.prompt]));
    const out=await extraCall(extra+"\n\nPrompts (JSON, one per box id):\n"+JSON.stringify(P,null,1)+'\n\nReply with only JSON with the same keys: {"<box id>": "<the reworded prompt>"}'); v.extra_output=out; const j=parseJ(out);
    if(!j) throw {msg:"The wording call did not return the prompts. Try again."};
    for(const [id,old] of Object.entries(P)){ const nw=String(j[id]||""); const ph=old.match(/\{\{\w+\}\}/g)||[];
      if(!nw||ph.some(p=>!nw.includes(p))) throw {msg:"The reworded prompt of "+by[id].label+" lost a placeholder. Try again."}; v.changes[id]={prompt:nw}; }
    v.what="wording of all "+llmNodes().length+" prompts (same meaning)"; return v; }
  if(t==="fact"||t==="boundary"){
    const out=await extraCall(extra+"\n\nCase:\n"+input+'\n\nReply with only JSON: {"input": "<the whole case, with only this one change>", "change": "<what you changed, from what to what, in one line>"}'); v.extra_output=out; const j=parseJ(out);
    if(!j||!j.input||String(j.input).trim()===input.trim()) throw {msg:"The "+t+" call did not change the case. Try again."};
    v.input=String(j.input); v.what=String(j.change||"one "+t+" change"); return v; }
  if(t==="agents"){ const F=feeders();
    const out=await extraCall(extra+"\n\nCase:\n"+input+"\n\nBoxes you may choose (id: name):\n"+F.map(n=>n.id+": "+n.label).join("\n")+'\n\nReply with only JSON: {"box": "<id>", "wrong_fact": "<one sentence>"}'); v.extra_output=out; const j=parseJ(out);
    const n=j&&F.find(x=>x.id===j.box); if(!n||!j.wrong_fact) throw {msg:"The agents call did not pick a box. Try again."};
    v.changes[n.id]={prompt:n.cfg.prompt+"\n\nAssume that: "+String(j.wrong_fact)}; v.what=n.label+" gets a wrong fact: "+String(j.wrong_fact); return v; }
  return v;
}
function applyVariation(v){ const g={nodes:clone(G.nodes),edges:clone(G.edges)}; g.nodes.forEach(n=>{ const c=v&&v.changes[n.id]; if(c) Object.assign(n.cfg,c); }); return g; }

function renderEval(){
  const sel=TESTS.find(x=>x.type===ST.test)||TESTS[0]; ST.test=sel.type;
  $("testSel").innerHTML=TESTS.map(t=>{ const d=Math.min(doneOf(t.type),RUNS_PER_TEST); return `<option value="${t.type}" ${t.type===sel.type?"selected":""}>${esc(t.label)} · ${d}/${RUNS_PER_TEST}${d>=RUNS_PER_TEST?" ✓":""}</option>`; }).join("");
  const left=Math.max(0,RUNS_PER_TEST-doneOf(sel.type)), nDone=TESTS.filter(t=>doneOf(t.type)>=RUNS_PER_TEST).length;
  $("testRun").textContent=left?"Run test":"Done"; $("testRun").disabled=!left||!sample||running; $("testSel").disabled=running;
  $("runSel").innerHTML=`<option value="">${ST.log.length?"choose a run":"no runs yet"}</option>`+ST.log.map((l,i)=>`<option value="${i}" ${ST.review===i?"selected":""}>${esc(l.run_id)} · ${esc(l.variation_type==="run"?"free run":l.variation_type+" "+l.repeat_no+"/"+RUNS_PER_TEST)} · ${esc(l.error?"error":(l.ai_outcome||"?"))}</option>`).reverse().join(""); $("runSel").disabled=running||!ST.log.length;
  const v=ST.vars[sel.type];
  $("tsum").innerHTML=`<span>${esc(sel.label)}: ${esc(sel.q)}</span><span>·</span><span class="${nDone===TESTS.length?"done":""}">${nDone} of ${TESTS.length} tests done</span>`;
  $("tbody").innerHTML=`<div><b>${esc(sel.label)}</b> <span class="hint">· ${esc(sel.step)}</span></div><div>${esc(sel.change)} ${RUNS_PER_TEST} runs, on the same input as every other test${ST.evalInput?" (fixed at the first test run)":" (the data of the tabs at the first test run)"}.</div>
    ${sel.extra?(v?`<div class="f"><span>Extra prompt used</span><pre>${esc(v.extra_prompt)}</pre></div>`:`<label class="f"><span>Extra prompt (you can change it before the first run of this test)</span><textarea id="extra" rows="3">${esc(ST.extra[sel.type]!=null?ST.extra[sel.type]:sel.extra)}</textarea></label>`):""}
    ${v&&v.what?`<div class="f"><span>What was changed (the same in every run of this test)</span><pre>${esc(v.what)}</pre></div>`:""}
    ${nDone===TESTS.length?`<div class="done">All ${TESTS.length} tests are done. Download the log, type sync in Claude Code, then findings.</div>`:""}
    ${ST.log.some(l=>l.variation_type!=="run")?`<div><button class="btn sm" type="button" id="clearEval">Start the evaluation over</button></div>`:""}`;
  if($("extra")) $("extra").addEventListener("input",e=>{ ST.extra[sel.type]=e.target.value; save(); });
  if($("clearEval")) $("clearEval").onclick=()=>{ const b=$("clearEval"); if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Yes, delete every run of the evaluation"; return; } ST.log=ST.log.filter(l=>l.variation_type==="run"); ST.vars={}; ST.evalInput=null; ST.review=null; save(); restore(null); render(); };
}
$("testSel").addEventListener("change",e=>{ ST.test=e.target.value; save(); renderEval(); });
$("testRun").addEventListener("click",()=>runTest(ST.test));
function renderControls(){ $("runBtn").disabled=running||!sample; $("stopBtn").hidden=!running; }
function render(){ renderTabs(); renderControls(); renderEval(); renderFlow(); renderPanel(); renderMsgs(); renderAdvice(); }

/* ---- run: the shared engine, one separate call to Claude per box ---- */
let sample=null, toolsOK=false;
(async()=>{ try{ sample=window.claude&&window.claude.use?await window.claude.use("sample"):null; }catch(e){}
  if(sample){ try{ const lim=await sample.limits(); toolsOK=!!(lim&&lim.tools); }catch(e){} } else $("msg").textContent="Open this page in Claude to run the agents.";
  renderControls(); renderEval(); })();
const ERR={not_granted:"You did not allow this page to use Claude.",rate_limited:"Too many calls, or your usage limit is reached. Wait and try again.",cancelled:"Stopped.",sampling_disabled:"Claude is not available for this account."};
const outcomeOf=t=>{ const m=String(t||"").match(/Advice:\s*([^\n]+)/i); const s=(m?m[1]:String(t||"")).toLowerCase(); const f=OUTCOMES.find(o=>o.keys.some(k=>s.includes(k))); return f?f.name:(m?m[1].trim():""); };
async function runOnce(type,v){
  live={steps:[],calls:null}; restore(null); render();
  const hooks={status:(id,s)=>{ status[id]=s; renderFlow(); renderTabs(); if(agentsOn(ST.tab).some(n=>n.id===id)) renderPanel(); }, hot:(a,b)=>{ hot.add(a+">"+b); renderFlow(); },
    bubble:(id,b)=>{ if(!b) delete bubbles[id]; else { bubbles[id]=b; if(b.end){ const ref=b; setTimeout(()=>{ if(bubbles[id]===ref){ delete bubbles[id]; renderFlow(); } },1800); } } renderFlow(); if(STEP_OF[id]===ST.tab) renderPanel(); },
    label:(id,t)=>{ labels[id]=t; renderFlow(); }, step:s=>{ if(!live.steps.includes(s)) live.steps.push(s); renderMsgs(); }};
  const g=v?applyVariation(v):G, input=v?v.input:caseText();
  let res=null, err=null;
  try{ res=await ENGINE.run(g,{sample,toolsOK,input,knowledge:STRATEGY.knowledge||"",memory:ST.memory||(ST.memory=[]),onMemory:save,signal:ctl.signal,hooks}); }catch(e){ err=e; }
  ST.seq++;
  const rec={run_id:"D"+String(ST.seq).padStart(3,"0"),date_time:new Date().toISOString(),source:"dashboard",strategy:STRATEGY.strategy,strategy_version:STRATEGY.version,run_version:ENGINE.version(g),input,
    variation_type:type,what_changed:v?v.what:"",extra_prompt:v?v.extra_prompt:"",extra_output:v?v.extra_output:"",repeat_no:ST.log.filter(l=>l.variation_type===type&&!l.error).length+1,
    models_asked:res?res.models_asked.join("; "):"",models_answered:res?res.models_answered.join("; "):"",
    ai_output:res?res.output:"",ai_outcome:res?outcomeOf(res.output):"",
    calls:res?res.calls:0,tokens_est:res?res.tokens_est:0,seconds:res?res.seconds:null,error:err?(err.msg||err.code||"failed"):"",
    steps:res?res.steps:live.steps,status:{...status},labels:{...labels},hot:[...hot]};
  ST.log.push(rec); ST.review=ST.log.length-1; live=null; bubbles={}; save();
  if(err) throw err;
}
async function guarded(label,fn){
  if(running||!sample) return; running=true; ctl=new AbortController(); $("msg").classList.remove("err"); $("msg").textContent=label; renderControls(); renderEval();
  try{ await fn(); }
  catch(e){ $("msg").classList.add("err"); $("msg").textContent=e.msg||ERR[e.code]||"Something went wrong. Try again."; }
  running=false; save(); restore(shownRun()); render();
}
$("runBtn").addEventListener("click",()=>guarded("Running…",async()=>{ await runOnce("run",null); $("msg").textContent="Done. The advice is under the flow. This free run is not part of the evaluation."; }));
function runTest(type){ const T=TESTS.find(t=>t.type===type);
  guarded("Preparing the "+T.label+" test…",async()=>{
    if(!ST.evalInput){ ST.evalInput=caseText(); save(); }
    if(!ST.vars[type]){ ST.vars[type]=await makeVariation(type,ST.evalInput); save(); renderEval(); }
    while(doneOf(type)<RUNS_PER_TEST){ $("msg").textContent=T.label+" test: run "+(doneOf(type)+1)+" of "+RUNS_PER_TEST+"…"; await runOnce(type,ST.vars[type]); }
    const saved=await saveLog();
    $("msg").textContent=T.label+" test done ("+RUNS_PER_TEST+" runs). "+(saved?"The log was downloaded ("+logName()+".csv and .json). ":"The log was not downloaded: click Download log. ")+(allDone()?"All tests are done: type sync, then findings, in Claude Code.":"Type sync in Claude Code, or run the next test."); }); }
$("stopBtn").addEventListener("click",()=>{ if(ctl) ctl.abort(); });

/* ---- downloads in the log format ---- */
const COLS=["run_id","date_time","source","strategy","strategy_version","run_version","input","variation_type","what_changed","extra_prompt","extra_output","repeat_no","models_asked","models_answered","ai_output","ai_outcome","calls","tokens_est","seconds","error"];
function csv(){ const q=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }; return [COLS.join(",")].concat(ST.log.map(l=>COLS.map(c=>q(l[c])).join(","))).join("\n"); }
/* the file name tells "sync" where the log belongs: runs-<strategy>.csv / .json, with every run and every test */
const logName=()=>"runs-"+slug(STRATEGY.strategy);
const slug=s=>String(s||"strategy").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function download(name,data){ try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(dl){ await dl.save({filename:name,data}); $("msg").textContent="Saved "+name+"."; return; } }catch(e){ if(e&&e.code){ $("msg").textContent="Not saved."; return; } }
  try{ await navigator.clipboard.writeText(data); $("msg").textContent="Download is not available here, so the file was copied."; }catch(e){ $("msg").textContent="Download is not available in this view."; } }

restore(shownRun()); render();
})();
</script>
