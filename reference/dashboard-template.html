<style>
/* Layout: a student's workflow dashboard (example: what do we cook tonight? Dishes, Guests, Budget & time, Choose; one tab per step) as an agentic version for ONE strategy. When built for a student, the look and layout of their own dashboard are kept and these pieces are added to it. Under the tabs: the AI flow (In to Out, live). Run opens the evaluation form: the student chooses the evaluation step and method of the run, and changes the input, a prompt or a model by hand; every run is logged. Left: the tab, with the agent that works on this step on top and the original content below. Right: the agents' conversation. Under the flow: the advice of the run shown, with a note field. The run log is downloaded for sync and findings. */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --green-fill:#25301c; --green-line:#5d7c3e; --green-ink:#a9d27b; --io-fill:#3a2620; --io-line:#8a4e39; --io-ink:#f0a184;
  --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0; --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}}

  --code-fill:#2a2738; --code-line:#5c5490; --code-ink:#b9b0f0; --arrow:#7d7a72; --live:#f0ad4d; --live-fill:#3b2d14; --bad:#ef8e7e; --accent:#f0a184; color-scheme:dark}

<script>

(() => {
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---- the student's workflow data (invented): the same dinner example as in the playground ---- */
/* ---------- the one example, everywhere: what do we cook tonight? (invented data)
   The same workflow and the same data in the playground, the sandbox and the example dashboard.
   Workflow: 1 Dishes -> 2 Guests (diets and preferences) -> 3 Budget & time -> 4 Choose (the decision). ---------- */
const WORKFLOW=[
  {id:"dishes",n:1,label:"Dishes",what:"What we can cook: 18 dishes with their ingredients, cost and time."},
  {id:"guests",n:2,label:"Guests",what:"Which dishes every guest can and wants to eat: diets, allergies, preferences."},
  {id:"budget",n:3,label:"Budget & time",what:"Which dishes fit the budget, the time and the kitchen."},
  {id:"choose",n:4,label:"Choose",what:"The decision: one dish for everyone, with any change to the recipe."}];
const DINNER={budget:30,minutes:45,kitchen:"one oven, two hobs"};
const GUESTS=[
  {id:"anna",name:"Anna",diet:"vegetarian: no meat, no fish",likes:"loves pasta and Italian food",avoid:["meat","fish"],who:"You are vegetarian (no meat, no fish) and you love pasta and Italian food."},

/* cost in euro for four people; min = minutes; tags = what a guest may have to avoid */
const DISHES=[
  {name:"Vegetable curry with rice",short:"Veg curry",keys:["vegetable curry","veg curry"],cost:14,min:40,kitchen:"two hobs",taste:"spicy",ingredients:"chickpeas, cauliflower, cashew nuts, cream, curry paste, rice",tags:["nuts","lactose"]},
  {name:"Pasta pesto",short:"Pasta pesto",keys:["pesto"],cost:10,min:20,kitchen:"one hob",taste:"mild",ingredients:"spaghetti, basil, pine nuts, parmesan, olive oil",tags:["nuts","lactose"]},
  {name:"Mushroom risotto",short:"Risotto",keys:["risotto"],cost:16,min:45,kitchen:"one hob",taste:"mild",ingredients:"risotto rice, mushrooms, butter, parmesan, vegetable stock",tags:["mushrooms","lactose"]},

/* ways to adapt a recipe: the notes the retrieval tool searches */
const KNOWLEDGE="Vegetable curry can be made without cashew nuts; coconut milk can replace the cream.\n\nThai green curry can be made without peanuts; check that the curry paste has no peanuts.\n\nPesto can be made with sunflower seeds instead of pine nuts, and without parmesan.\n\nLentil dahl can be served with rice instead of naan; the naan has butter and yoghurt.\n\nFalafel wraps can be served with a tahini sauce instead of the yoghurt sauce.\n\nRisotto can be made with olive oil instead of butter, and without parmesan; it still has mushrooms.\n\nChilli flakes on the side make a mild dish spicy for one person.\n\nThe last time this group ate together, they had pasta.";
/* the In text: only the data (steps 1 to 3); what to do with it is in the prompts of the boxes */
function dinnerCase(d){ d=d||DINNER;
  return "Dishes (cost for four people, time, kitchen, taste, ingredients):\n"+DISHES.map((x,i)=>`${i+1}. ${x.name}: €${x.cost}, ${x.min} min, ${x.kitchen}, ${x.taste}. ${x.ingredients}.`).join("\n")
    +"\n\nGuests (diets and preferences):\n"+GUESTS.map(g=>`- ${g.name}: ${g.diet}; ${g.likes}.`).join("\n")
    +`\n\nBudget and time: €${d.budget} in total for four people, ${d.minutes} minutes, kitchen: ${d.kitchen}.`; }
/* the steps of the workflow are the tabs of the dashboard */
const STEPS=WORKFLOW;
/* the possible outcomes, read from the line "Advice: <outcome>" */
const OUTCOMES=DISHES.map(d=>({name:d.name,keys:d.keys}));
/* ---- the strategy, rebuilt from the "Boxes" section of the student's strategy file ---- */
const STRATEGY=/*__STRATEGY_JSON__*/;
/* which tab each box works on ("Tab of my dashboard" in the file, confirmed by the student) */
const STEP_OF=/*__STEP_OF__*/;
const G={nodes:STRATEGY.nodes,edges:STRATEGY.edges};
STRATEGY.version=STRATEGY.version||ENGINE.version(G);
/* ---- automatic layout: columns by step in the flow, debaters on a circle, tool boxes under their LLM ---- */
(function layout(){
  const by0=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const nDeb=G.nodes.filter(n=>n.type==="debater").length;
  G.nodes.forEach(n=>{ n.w=n.w||(n.type==="in"||n.type==="out"?84:n.type==="debater"?(nDeb>4?130:110):Math.max(110,Math.min(200,(n.label.length+3)*10+16))); n.h=n.h||(n.type==="in"||n.type==="out"?46:n.type==="debater"&&nDeb>4?46:54); });
  if(G.nodes.every(n=>n.x!=null)) return;
  const flow=G.edges.filter(e=>by0[e.from]&&by0[e.to]&&!e.loop&&by0[e.from].type!=="aux"&&by0[e.to].type!=="aux"&&!(by0[e.from].type==="debater"&&by0[e.to].type==="debater"));
  const depth={}; G.nodes.forEach(n=>{ if(n.type==="in") depth[n.id]=0; });
  for(let k=0;k<G.nodes.length;k++) flow.forEach(e=>{ if(depth[e.from]!=null) depth[e.to]=Math.max(depth[e.to]??0,depth[e.from]+1); });
  const deb=G.nodes.filter(n=>n.type==="debater"), ring=deb.length>1;
  const cols=[]; G.nodes.forEach(n=>{ if(n.type!=="aux"&&!(ring&&n.type==="debater")) (cols[depth[n.id]??0] ||= []).push(n); });
  const R=deb.length>4?170:110, dd=ring?(depth[deb[0].id]??1):-1; let x=70, cx=0;
  const nCol=Math.max(cols.length,dd+1);
  for(let d=0;d<nCol;d++){ const col=cols[d]||[];
    if(d===dd){ cx=x+R+70; x=cx+R+140; }
    const wmax=Math.max(0,...col.map(n=>n.w)); col.forEach((n,i)=>{ n.x=(d===dd?cx:x+wmax/2); n.y=220+(i-(col.length-1)/2)*Math.max(95,R*2/Math.max(1,col.length-1)); });
    if(d!==dd) x+=wmax+80; }
  if(ring){ deb.forEach((n,i)=>{ const a=-Math.PI/2+i*2*Math.PI/deb.length; n.x=cx+R*Math.cos(a); n.y=220+R*Math.sin(a); });
    const from=flow.find(e=>e.to===deb[0].id), to=flow.find(e=>e.from===deb[0].id);
    G.ring={x:cx,y:220,r:R,pad:Math.max(62,Math.max(...deb.map(n=>n.w))/2+12),label:(deb[0].cfg.rounds||2)+" rounds: they answer each other",from:from&&from.from,to:to&&to.to};
    G.edges.forEach(e=>{ if((by0[e.from]&&by0[e.from].type==="debater")||(by0[e.to]&&by0[e.to].type==="debater")) e.hide=1; }); }
  G.nodes.filter(n=>n.type==="aux").forEach((n,i,all)=>{ const e=G.edges.find(e=>e.from===n.id||e.to===n.id), host=e&&by0[e.from===n.id?e.to:e.from]||G.nodes[1]; n.w=110; n.h=46; n.x=host.x+(i-(all.length-1)/2)*170; n.y=host.y+170; });
})();
const by=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
const agentsOn=step=>G.nodes.filter(n=>STEP_OF[n.id]===step);

/* ---- the dashboard data become the In box ---- */
function caseText(){ return dinnerCase(ST); }

/* ---- saved state ---- */
const KEY="ai-dash-"+STRATEGY.version;
const ST={tab:STEPS[0].id,budget:DINNER.budget,minutes:DINNER.minutes,kitchen:DINNER.kitchen,log:[],review:null,seq:0,over:{},inputOver:null,title:"",showIn:false};
/* the input as built, before any change: every run is compared with it */
const ORIG_INPUT=caseText();
try{ Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };

/* ---- what the flow shows: a live run or the selected saved run ---- */
let status={}, labels={}, bubbles={}, hot=new Set(), running=false, ctl=null, live=null;
const shownRun=()=>live||(ST.review!=null?ST.log[ST.review]:null);
function restore(r){ status={}; labels={}; bubbles={}; hot=new Set(); if(r){ Object.assign(status,r.status||{}); Object.assign(labels,r.labels||{}); (r.hot||[]).forEach(k=>hot.add(k)); } }

/* ---- flow drawing (same look as the playground) ---- */
function anchor(a,b,p){ const dx=b.x-a.x,dy=b.y-a.y,hw=a.w/2+p,hh=a.h/2+p,t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9); return {x:a.x+dx*t,y:a.y+dy*t}; }
function epath(a,b,bend){ const p1=anchor(a,b,6),p2=anchor(b,a,8),mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1,cx=mx-dy/l*(bend||0)*1.6,cy=my+dx/l*(bend||0)*1.6; return {d:`M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`,lx:(p1.x+2*cx+p2.x)/4,ly:(p1.y+2*cy+p2.y)/4}; }
const kind=n=>n.type==="in"||n.type==="out"?"io":(n.type==="gate"?"code":"llm");
const MN={"claude-haiku-5-5":"Haiku 5.5","claude-sonnet-5-5":"Sonnet 5.5","claude-opus-5-5":"Opus 5.5"};
const mname=c=>c.model==="custom"?(c.customId||"Other model"):(MN[c.model]||c.model);
function wrapTail(s,w,n){ const ws=String(s||"").replace(/\s+/g," ").trim().split(" "),out=[]; let l=""; for(const x of ws){ if((l+" "+x).trim().length>w){ if(l) out.push(l); l=x; } else l=(l+" "+x).trim(); } if(l) out.push(l); const t=out.slice(-n); if(out.length>n) t[0]="…"+t[0]; return t; }
function renderFlow(){
  const xs=G.nodes.flatMap(n=>[n.x-n.w/2,n.x+n.w/2]), ys=G.nodes.flatMap(n=>[n.y-n.h/2,n.y+n.h/2]);
  const x0=Math.min(0,Math.min(...xs)-10), x1=Math.max(1000,Math.max(...xs)+10), y0=Math.max(0,Math.min(...ys)-64), y1=Math.max(...ys)+(G.ring?70:24);
  $("flow").setAttribute("viewBox",`${x0} ${y0} ${x1-x0} ${y1-y0}`);
  let h=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--arrow)" stroke-width="1.6"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--live)" stroke-width="1.8"/></marker></defs>`;
  if(G.ring){ const R=G.ring, rh=[...hot].some(k=>{ const [a,b]=k.split(">"); return by[a]&&by[b]&&by[a].type==="debater"&&by[b].type==="debater"; });
    h+=`<g class="ring ${rh?"hot":""}"><circle cx="${R.x}" cy="${R.y}" r="${R.r}"/><text x="${R.x}" y="${R.y+R.r+44}">${esc(R.label||"")}</text></g>`;
    const a=by[R.from], b=by[R.to];
    if(a){ const k=[...hot].some(x=>x.startsWith(R.from+">")); const p1=anchor(a,{x:R.x,y:R.y},6); h+=`<g class="e ${k?"hot":""}"><path d="M${p1.x},${p1.y} L${R.x-R.r-(R.pad||62)},${R.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; }
    if(b){ const k=[...hot].some(x=>x.endsWith(">"+R.to)); const p2=anchor(b,{x:R.x,y:R.y},8); h+=`<g class="e ${k?"hot":""}"><path d="M${R.x+R.r+(R.pad||62)},${R.y} L${p2.x},${p2.y}" marker-end="url(#${k?"ahh":"ah"})"/></g>`; } }
  G.edges.forEach(e=>{ if(e.hide) return; const a=by[e.from],b=by[e.to]; if(!a||!b) return; const p=epath(a,b,e.bend||0), k=hot.has(e.from+">"+e.to);
    h+=`<g class="e ${e.dash?"dash":""} ${k?"hot":""}"><path d="${p.d}" marker-end="url(#${k?"ahh":"ah"})"/>${e.label?`<text x="${p.lx}" y="${p.ly}">${esc(e.label)}</text>`:""}</g>`; });
  G.nodes.forEach(n=>{ const st=STEPS.find(s=>s.id===STEP_OF[n.id]); const lab=labels[n.id]||n.label; const chg=n.type==="in"?inputChanged():boxChanged(n.id); const sub=n.type==="aux"||n.type==="out"?"":(n.type==="in"?(chg?"changed":""):(n.type==="gate"?"max "+n.cfg.maxWords+" words":[mname(Object.assign({},n.cfg,ST.over[n.id]||{})),chg?"changed":""].filter(Boolean).join(" · ")));
    h+=`<g class="n ${kind(n)} ${status[n.id]||""} ${(n.type==="in"?ST.showIn:STEP_OF[n.id]===ST.tab&&!ST.showIn)?"cur":""}" data-go="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(lab)}"><rect x="${n.x-n.w/2}" y="${n.y-n.h/2}" width="${n.w}" height="${n.h}" rx="${kind(n)==="io"?n.h/2:3}"/><text x="${n.x}" y="${n.y-(sub?6:0)}">${esc(lab.length>n.w/9.6?lab.slice(0,Math.floor(n.w/9.6)-1)+"…":lab)}</text>${sub?`<text class="sub" x="${n.x}" y="${n.y+14}">${esc(sub)}</text>`:""}</g>`; });
  for(const [id,b] of Object.entries(bubbles)){ const n=by[id]; if(!n||!b) continue; const L=b.thinking?[]:wrapTail(b.text,30,2), W=b.thinking?62:210, H=b.thinking?26:L.length*16+14;
    const below=G.ring&&n.type==="debater"&&n.y>G.ring.y+10;
    const x=Math.max(x0+4,Math.min(x1-W-4,n.x-W/2)), y=below?n.y+n.h/2+12:Math.max(y0+2,n.y-n.h/2-12-H), tx=Math.max(x+12,Math.min(x+W-12,n.x));
    h+=`<g class="bub"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10"/><path d="${below?`M${tx-7},${y+0.6} L${tx},${y-9} L${tx+7},${y+0.6}`:`M${tx-7},${y+H-0.6} L${tx},${y+H+9} L${tx+7},${y+H-0.6}`}"/><rect x="${tx-8}" y="${below?y+1:y+H-3}" width="16" height="3" style="stroke:none;fill:var(--card)"/>`;
    if(b.thinking) h+=`<g><circle class="dot" cx="${x+19}" cy="${y+13}" r="3.5"/><circle class="dot" cx="${x+31}" cy="${y+13}" r="3.5"/><circle class="dot" cx="${x+43}" cy="${y+13}" r="3.5"/></g>`; else L.forEach((l,i)=>h+=`<text x="${x+11}" y="${y+8+i*16}">${esc(l)}</text>`); h+=`</g>`; }
  $("flow").innerHTML=h;
  const r=shownRun(); $("stats").textContent = r&&r.calls!=null ? `${r.calls} calls · ≈${(r.tokens_est||0).toLocaleString()} tokens (estimate) · ${r.seconds} s${r.run_id?" · run "+r.run_id:""}` : (live?"running…":"");
}
const goNode=id=>{ const n=by[id]; ST.showIn=n.type==="in"; if(n.type!=="in"&&n.type!=="out") ST.tab=STEP_OF[id]||ST.tab; save(); render(); };
$("flow").addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g) goNode(g.dataset.go); });
$("flow").addEventListener("keydown",e=>{ const g=e.target.closest("[data-go]"); if(g&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); goNode(g.dataset.go); } });

/* ---- the agents' conversation: every step, with what went in and what came out ---- */
function renderMsgs(){
  const r=shownRun(), S=r?r.steps||[]:[];
  if(!S.length){ $("msgs").innerHTML=`<p class="hint">Press Run. Every step appears here: what the In box sends, what each agent says (and what it received), every check and tool, and what reaches Out.</p>`; return; }
  let lastRound=null, h="";
  S.forEach(s=>{
    if(s.round&&s.round!==lastRound&&s.type==="debater"){ h+=`<div class="round">Round ${s.round}</div>`; } if(s.type==="debater") lastRound=s.round;
    const tab=STEPS.find(t=>t.id===STEP_OF[s.id]);
    if(s.type==="in"){ h+=`<div class="m io"><div class="who">In <small>from the tabs · the case</small></div><div class="txt">${esc(s.output)}</div></div>`; return; }
    if(s.type==="out"){ h+=`<div class="m io"><div class="who">Out <small>the advice</small></div><div class="txt">${esc(s.output)}</div></div>`; return; }
    if(s.type==="gate"||s.type==="tool"){ h+=`<div class="m sys"><div class="who">${esc(s.label)}</div><div class="txt">${esc(s.input?s.input+"\n→ ":"")}${esc(String(s.output).slice(0,600))}</div></div>`; return; }
    h+=`<div class="m ${s.t_end==null?"running":""}"><div class="who">${esc(s.label)}${tab?` <small>step ${tab.n}</small>`:""}${s.round?` <small>round ${s.round}</small>`:""} <small>${esc(s.model_answered||s.model_asked||"")}${s.t_end!=null?" · "+((s.t_end-s.t_start)/1000).toFixed(1)+" s":""}</small></div>
      <div class="txt">${esc(s.output)||"…"}${s.note?"\n\n→ "+esc(s.note):""}</div>
      <details><summary>What it received</summary><pre>${esc(s.input||"(nothing)")}</pre><details><summary>Full prompt sent</summary><pre>${esc(s.prompt||"")}</pre></details></details></div>`;
  });
  $("msgs").innerHTML=h;
}

/* ---- tabs and panel ---- */
function renderTabs(){ $("tabs").innerHTML=STEPS.map(s=>{ const ag=agentsOn(s.id); const st=ag.some(n=>status[n.id]==="running")?"running":(ag.length&&ag.every(n=>status[n.id]==="done")?"done":""); return `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${ST.tab===s.id}"><span class="n">${s.n}</span>${esc(s.label)}${ag.length?`<span class="dot ${st}" aria-hidden="true"></span>`:""}</button>`; }).join(""); }
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; ST.tab=b.dataset.tab; ST.showIn=false; save(); render(); });
function agentCards(step){
  const r=shownRun(); return agentsOn(step).map(n=>{ const ss=r?(r.steps||[]).filter(s=>s.id===n.id):[]; const last=ss[ss.length-1]; const st=status[n.id]||"";
    const body = live&&st==="running"&&!(bubbles[n.id]&&bubbles[n.id].text) ? "…" : (bubbles[n.id]&&bubbles[n.id].text&&st==="running" ? bubbles[n.id].text : (last?last.output+(last.note?"\n\n→ "+last.note:""):"Press Run. This agent does this step."));
    return `<div class="agent"><div class="abox ${st}"><b>${esc(labels[n.id]||n.label)}</b><span>${esc(n.type)} · ${esc(mname(Object.assign({},n.cfg,ST.over[n.id]||{})))} · ${esc(st||"idle")}</span></div><div><div class="alabel">What the agent says${ss.length>1?" (last of "+ss.length+")":""}</div><div class="bubble">${esc(body)}</div>${last?`<details style="margin-top:6px;font-size:12px"><summary style="cursor:pointer;color:var(--muted)">What it received</summary><pre style="white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px">${esc(last.input)}</pre></details>`:""}${LLM_TYPES.includes(n.type)?editHtml(n):""}</div></div>`; }).join("");
}
const ok=(g,d)=>!d.tags.some(t=>g.avoid.includes(t));
/* ---- the dashboard's own tabs (replace these with the student's tabs) ---- */
const fitsBudget=d=>d.cost<=ST.budget&&d.min<=ST.minutes;
function tabHtml(id){
  if(id==="dishes") return `<h2>1 · Dishes</h2><p class="hint">What we can cook: cost for four people, time, kitchen, taste and ingredients.</p><div class="tablebox"><table><thead><tr><th>Dish</th><th>€</th><th>Min</th><th>Kitchen</th><th>Taste</th><th>Ingredients</th></tr></thead><tbody>${DISHES.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${d.cost}</td><td class="num">${d.min}</td><td>${esc(d.kitchen)}</td><td>${esc(d.taste)}</td><td>${esc(d.ingredients)}</td></tr>`).join("")}</tbody></table></div>`;
  if(id==="guests") return `<h2>2 · Guests</h2><div class="tablebox"><table><thead><tr><th>Guest</th><th>Diet</th><th>Preference</th></tr></thead><tbody>${GUESTS.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.diet)}</td><td>${esc(g.likes)}</td></tr>`).join("")}</tbody></table></div>
    <h3>Who can eat what</h3><div class="tablebox"><table><thead><tr><th>Dish</th>${GUESTS.map(g=>`<th>${esc(g.name)}</th>`).join("")}</tr></thead><tbody>${DISHES.map(d=>`<tr><td>${esc(d.name)}</td>${GUESTS.map(g=>`<td>${ok(g,d)?"OK":"<b>no</b>"}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="hint">“no” as the recipe is now; some recipes can be changed.</p>`;
  if(id==="budget") return `<h2>3 · Budget and time</h2><div class="grid2"><label class="f"><span>Budget for everyone (€)</span><input type="number" id="budget" value="${ST.budget}"></label><label class="f"><span>Time (minutes)</span><input type="number" id="minutes" value="${ST.minutes}"></label></div>
    <label class="f" style="margin:10px 0"><span>Kitchen</span><input type="text" id="kitchen" value="${esc(ST.kitchen)}"></label>
    <div class="tablebox"><table><thead><tr><th>Dish</th><th>€</th><th>Budget €${ST.budget}</th><th>Min</th><th>Time ${ST.minutes} min</th><th>Kitchen</th></tr></thead><tbody>${DISHES.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${d.cost}</td><td>${d.cost<=ST.budget?"within":"<b>over</b>"}</td><td class="num">${d.min}</td><td>${d.min<=ST.minutes?"in time":"<b>too long</b>"}</td><td>${esc(d.kitchen)}</td></tr>`).join("")}</tbody></table></div>`;
  if(id==="choose"){ const both=DISHES.filter(d=>GUESTS.every(g=>ok(g,d))&&fitsBudget(d));
    return `<h2>4 · Choose</h2><p class="hint">The decision. Without AI: the dishes that pass step 2 (every guest, recipe as it is) and step 3. The AI advice of the run shown is under the flow.</p><div class="tablebox"><table><thead><tr><th>Dish</th><th>€</th><th>Min</th><th>Taste</th></tr></thead><tbody>${both.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${d.cost}</td><td class="num">${d.min}</td><td>${esc(d.taste)}</td></tr>`).join("")||`<tr><td colspan="4">None: a recipe has to change.</td></tr>`}</tbody></table></div>`; }
  return "";
}
function bindTab(){ const bind=(id,k,num)=>{ const el=$(id); if(el) el.addEventListener("change",e=>{ ST[k]=num?(+e.target.value||0):e.target.value; save(); renderPanel(); }); };
  bind("budget","budget",1); bind("minutes","minutes",1); bind("kitchen","kitchen"); }
/* ---- END of the dashboard's own tabs ---- */

function renderPanel(){
  const s=STEPS.find(x=>x.id===ST.tab)||STEPS[0];
  $("panel").innerHTML=(ST.showIn?inCard():"")+agentCards(s.id)+tabHtml(s.id); bindTab(); bindEdit();
}
/* the advice of the run shown, under the flow */
function renderAdvice(){
  const l=live?null:(ST.review!=null?ST.log[ST.review]:null);
  if(!l){ $("advice").innerHTML=live?"":`<span class="hint">No advice yet. Give the run a title and press Run.</span>`; return; }
  $("advice").innerHTML=`<span class="hint">Advice · run ${esc(l.run_id)} · ${esc(l.title||"")}${l.repeat_no>1?", repeat "+l.repeat_no:""}${l.changes_detected&&l.changes_detected!=="none"?" · changed: "+esc(l.changes_detected):""}</span><span class="big">${esc(l.error?"Error: "+l.error:(l.ai_outcome||"(no clear outcome)"))}</span>${l.ai_output?`<details><summary>Full answer</summary><pre>${esc(l.ai_output)}</pre></details>`:""}
    <label class="f"><span>Issues with this run, or anything you noticed (goes into the log)</span><textarea id="runNote" rows="2">${esc(l.issues||"")}</textarea></label>`;
  $("runNote").addEventListener("change",e=>{ l.issues=e.target.value; save(); });
}
const logJSON=()=>JSON.stringify({strategy:STRATEGY.strategy,version:STRATEGY.version,original_input:ORIG_INPUT,original_boxes:G.nodes.filter(n=>LLM_TYPES.includes(n.type)).map(n=>({id:n.id,label:n.label,type:n.type,model:n.cfg.model,prompt:n.cfg.prompt})),runs:ST.log.map(l=>{ const r={...l}; delete r.status; delete r.labels; delete r.hot; return r; })},null,2);
/* saves both log files (every run so far); also called automatically when a test finishes */
async function saveLog(){ if(!ST.log.length){ $("msg").textContent="No runs yet."; return false; } await download(logName()+".csv",csv()); await download(logName()+".json",logJSON()); const ok=/^Saved/.test($("msg").textContent); if(ok) $("msg").textContent="Saved "+logName()+".csv and .json. Type sync in Claude Code."; return ok; }
$("dlLog").addEventListener("click",()=>saveLog());
$("runSel").addEventListener("change",e=>{ ST.review=e.target.value===""?null:+e.target.value; save(); restore(ST.review!=null?ST.log[ST.review]:null); render(); });

/* ---- the AI evaluation, by hand. Every run gets a title from the student (for example "Baseline" or "Vary input: budget €20").
   The student makes every change themselves: click a box in the flow to change its prompt or model, click In to change the input.
   Each run is documented and logged automatically; "findings" in Claude Code groups the runs by title. ---- */
const LLM_TYPES=["llm","worker","router","orchestrator","evaluator","debater"];
const llmNodes=()=>G.nodes.filter(n=>LLM_TYPES.includes(n.type));
const MODELS=[["claude-haiku-5-5","Haiku 5.5"],["claude-sonnet-5-5","Sonnet 5.5"],["claude-opus-5-5","Opus 5.5"]];
const clone=o=>JSON.parse(JSON.stringify(o));
/* what runs: the strategy as built, with the student's changes (ST.over) */
function effG(){ const g={nodes:clone(G.nodes),edges:clone(G.edges)}; g.nodes.forEach(n=>{ const o=ST.over[n.id]; if(o) Object.assign(n.cfg,o); }); return g; }
const curInput=()=>ST.inputOver!=null?ST.inputOver:caseText();
const inputChanged=()=>curInput().trim()!==ORIG_INPUT.trim();
const boxChanged=id=>{ const n=by[id], o=ST.over[id]||{}; return !!n&&((o.model&&o.model!==n.cfg.model)||(o.prompt!=null&&o.prompt!==n.cfg.prompt)); };
function changes(){ const c=[];
  if(inputChanged()) c.push(ST.inputOver!=null?"input changed by hand":"input changed in the tabs");
  llmNodes().forEach(n=>{ const o=ST.over[n.id]||{};
    if(o.model&&o.model!==n.cfg.model) c.push(n.label+": model "+mname(n.cfg)+" → "+mname({model:o.model}));
    if(o.prompt!=null&&o.prompt!==n.cfg.prompt) c.push(n.label+": prompt changed"); });
  return c; }
function tidy(id){ const n=by[id], o=ST.over[id]; if(!o) return; if(o.model===n.cfg.model) delete o.model; if(o.prompt===n.cfg.prompt) delete o.prompt; if(!Object.keys(o).length) delete ST.over[id]; }
/* the editors in the panel: the In box (the input) and every box (prompt and model) */
function inCard(){ return `<div class="agent incard"><div class="abox io"><b>In</b><span>the data that goes into the flow${inputChanged()?" · changed":""}</span></div><div>
  <label class="f"><span>Input of the next runs (from the data of the tabs; type here to change it)</span><textarea id="inText" rows="10">${esc(curInput())}</textarea></label>
  ${ST.inputOver!=null?`<button class="btn xs" type="button" id="inBack">Back to the data of the tabs</button>`:""}</div></div>`; }
function editHtml(n){ const o=ST.over[n.id]||{}, model=o.model||n.cfg.model, prompt=o.prompt!=null?o.prompt:n.cfg.prompt, ch=boxChanged(n.id);
  return `<details class="edit" ${ch?"open":""}><summary>Prompt and model${ch?` <span class="chg">changed</span>`:""}</summary>
    <label class="f"><span>Model</span><select data-model="${esc(n.id)}">${MODELS.map(([v,t])=>`<option value="${v}" ${v===model?"selected":""}>${t}</option>`).join("")}${MODELS.some(([v])=>v===model)?"":`<option value="${esc(model)}" selected>${esc(model)}</option>`}</select></label>
    <label class="f"><span>Prompt</span><textarea rows="6" data-prompt="${esc(n.id)}">${esc(prompt)}</textarea></label>
    ${ch?`<button class="btn xs" type="button" data-orig="${esc(n.id)}">Back to the original</button>`:""}</details>`; }
function bindEdit(){ const P=$("panel");
  P.querySelectorAll("[data-model]").forEach(s=>s.addEventListener("change",e=>{ const id=s.dataset.model; (ST.over[id] ||= {}).model=e.target.value; tidy(id); save(); renderFlow(); renderPanel(); }));
  P.querySelectorAll("[data-prompt]").forEach(t=>t.addEventListener("change",e=>{ const id=t.dataset.prompt; (ST.over[id] ||= {}).prompt=e.target.value; tidy(id); save(); renderFlow(); renderPanel(); }));
  P.querySelectorAll("[data-orig]").forEach(b=>b.onclick=()=>{ delete ST.over[b.dataset.orig]; save(); renderFlow(); renderPanel(); });
  const it=$("inText"); if(it) it.addEventListener("change",e=>{ ST.inputOver=e.target.value.trim()===caseText().trim()?null:e.target.value; save(); renderFlow(); renderPanel(); });
  const ib=$("inBack"); if(ib) ib.onclick=()=>{ ST.inputOver=null; save(); renderFlow(); renderPanel(); }; }
function renderControls(){ $("runBtn").disabled=running||!sample; $("stopBtn").hidden=!running; $("runTitle").disabled=running;
  $("runSel").innerHTML=`<option value="">${ST.log.length?"choose a run":"no runs yet"}</option>`+ST.log.map((l,i)=>`<option value="${i}" ${ST.review===i?"selected":""}>${esc(l.run_id)} · ${esc(l.title||"run")}${l.repeat_no>1?" #"+l.repeat_no:""} · ${esc(l.error?"error":(l.ai_outcome||"?"))}</option>`).reverse().join(""); $("runSel").disabled=running||!ST.log.length; }
function render(){ renderTabs(); renderControls(); renderFlow(); renderPanel(); renderMsgs(); renderAdvice(); }
$("runTitle").value=ST.title||"";
$("runTitle").addEventListener("input",e=>{ e.target.classList.remove("need"); ST.title=e.target.value; save(); });
$("runTitle").addEventListener("keydown",e=>{ if(e.key==="Enter") $("runBtn").click(); });
$("runBtn").addEventListener("click",()=>{ if(running) return; const t=$("runTitle").value.trim();
  if(!t){ $("runTitle").classList.add("need"); $("runTitle").focus(); $("msg").textContent="Give the run a title first, for example Baseline."; return; }
  guarded("Running…",async()=>{ await runOnce(t);
    $("msg").textContent="Done. The advice is under the flow. The run is in the log: when you are done running, click Download log, then type sync in Claude Code."; }); });

/* ---- run: the shared engine, one separate call to Claude per box ---- */
let sample=null, toolsOK=false;
(async()=>{ try{ sample=window.claude&&window.claude.use?await window.claude.use("sample"):null; }catch(e){}
  if(sample){ try{ const lim=await sample.limits(); toolsOK=!!(lim&&lim.tools); }catch(e){} } else $("msg").textContent="Open this page in Claude to run the agents.";
  renderControls(); })();
const ERR={not_granted:"You did not allow this page to use Claude.",rate_limited:"Too many calls, or your usage limit is reached. Wait and try again.",cancelled:"Stopped.",sampling_disabled:"Claude is not available for this account."};
const outcomeOf=t=>{ const m=String(t||"").match(/Advice:\s*([^\n]+)/i); const s=(m?m[1]:String(t||"")).toLowerCase(); const f=OUTCOMES.find(o=>o.keys.some(k=>s.includes(k))); return f?f.name:(m?m[1].trim():""); };
async function runOnce(title){
  live={steps:[],calls:null}; restore(null); render();
  const hooks={status:(id,s)=>{ status[id]=s; renderFlow(); renderTabs(); if(agentsOn(ST.tab).some(n=>n.id===id)) renderPanel(); }, hot:(a,b)=>{ hot.add(a+">"+b); renderFlow(); },
    bubble:(id,b)=>{ if(!b) delete bubbles[id]; else { bubbles[id]=b; if(b.end){ const ref=b; setTimeout(()=>{ if(bubbles[id]===ref){ delete bubbles[id]; renderFlow(); } },1800); } } renderFlow(); if(STEP_OF[id]===ST.tab) renderPanel(); },
    label:(id,t)=>{ labels[id]=t; renderFlow(); }, step:s=>{ if(!live.steps.includes(s)) live.steps.push(s); renderMsgs(); }};
  const g=effG(), input=curInput(), rv=ENGINE.version(g), ch=changes();
  let res=null, err=null;
  try{ res=await ENGINE.run(g,{sample,toolsOK,input,knowledge:STRATEGY.knowledge||"",memory:ST.memory||(ST.memory=[]),onMemory:save,signal:ctl.signal,hooks}); }catch(e){ err=e; }
  ST.seq++;
  const same=ST.log.filter(l=>!l.error&&l.title===title&&l.run_version===rv&&l.input===input).length;
  const now=new Date(), p2=x=>String(x).padStart(2,"0");
  const rec={run_id:"D"+String(ST.seq).padStart(3,"0"),date_time:now.toISOString(),date:now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate()),time:p2(now.getHours())+":"+p2(now.getMinutes())+":"+p2(now.getSeconds()),
    source:"dashboard",strategy:STRATEGY.strategy,strategy_version:STRATEGY.version,run_version:rv,title,changes_detected:ch.join("; ")||"none",repeat_no:same+1,
    input,models_asked:res?res.models_asked.join("; "):"",models_answered:res?res.models_answered.join("; "):"",
    ai_output:res?res.output:"",ai_outcome:res?outcomeOf(res.output):"",
    calls:res?res.calls:0,tokens_est:res?res.tokens_est:0,seconds:res?res.seconds:null,error:err?(err.msg||err.code||"failed"):"",issues:"",
    settings:g.nodes.filter(n=>LLM_TYPES.includes(n.type)||n.type==="gate").map(n=>({id:n.id,label:n.label,type:n.type,model:n.cfg.model||"",effort:n.cfg.effort||"",tools:n.cfg.tools||[],prompt:n.cfg.prompt||"",maxWords:n.cfg.maxWords,maxRounds:n.cfg.maxRounds,rounds:n.cfg.rounds})),
    steps:res?res.steps:live.steps,transcript:res?res.transcript:"",status:{...status},labels:{...labels},hot:[...hot]};
  rec.prompts=rec.settings.filter(x=>x.prompt).map(x=>"["+x.label+"]\n"+x.prompt).join("\n\n");
  rec.settings_text=rec.settings.map(x=>x.label+": "+[x.type,x.model,x.effort&&"effort "+x.effort,x.tools.length&&"tools "+x.tools.join("+"),x.maxWords&&"max "+x.maxWords+" words",x.maxRounds&&"max "+x.maxRounds+" rounds",x.rounds&&x.rounds+" rounds"].filter(Boolean).join(", ")).join("; ");
  rec.trace=(rec.steps||[]).map(t=>"["+t.label+(t.round?" · round "+t.round:"")+(t.model_answered?" · "+t.model_answered:"")+"]\n"+String(t.output||"")+(t.note?"\n→ "+t.note:"")).join("\n\n");
  ST.log.push(rec); ST.review=ST.log.length-1; live=null; bubbles={}; save();
  if(err) throw err;
}
async function guarded(label,fn){
  if(running||!sample) return; running=true; ctl=new AbortController(); $("msg").classList.remove("err"); $("msg").textContent=label; renderControls();
  try{ await fn(); }
  catch(e){ $("msg").classList.add("err"); $("msg").textContent=e.msg||ERR[e.code]||"Something went wrong. Try again."; }
  running=false; save(); restore(shownRun()); render();
}
$("stopBtn").addEventListener("click",()=>{ if(ctl) ctl.abort(); });

/* ---- downloads in the log format (reference/log-format.md) ---- */
const COLS=["run_id","date","time","title","source","strategy","strategy_version","run_version","changes_detected","repeat_no","input","models_asked","models_answered","prompts","settings_text","ai_output","ai_outcome","calls","tokens_est","seconds","trace","error","issues"];
function csv(){ const q=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }; return [COLS.join(",")].concat(ST.log.map(l=>COLS.map(c=>q(l[c])).join(","))).join("\n"); }
/* the file name tells "sync" where the log belongs: runs-<strategy>.csv / .json, with every run and every test */
const logName=()=>"runs-"+slug(STRATEGY.strategy);
const slug=s=>String(s||"strategy").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function download(name,data){ try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(dl){ await dl.save({filename:name,data}); $("msg").textContent="Saved "+name+"."; return; } }catch(e){ if(e&&e.code){ $("msg").textContent="Not saved."; return; } }
  try{ await navigator.clipboard.writeText(data); $("msg").textContent="Download is not available here, so the file was copied."; }catch(e){ $("msg").textContent="Download is not available in this view."; } }

restore(shownRun()); render();
})();
</script>
